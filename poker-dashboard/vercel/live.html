<style>
/* Live tables (Nov 2026): one shared blackjack / Free Bet / UTH table, opened by any member of the Discord server.
   Everyone plays their own hand at the same time against the same dealer (Renato's pick "B"). Server: /api/live (api/_live.js +
   api/_livegame.js, the same settle code as the solo games). Seats wear the poker room's look: Discord pfp in its border, overall bar
   washing into the nameplate, sticker on the corner, title as a slanted tab (plates.js + /api/shop loadouts). Live via Ably "live:table". */
:root {
  --page: #15132a; --panel: #1d1a37; --panel2: #2a2550; --line: #332e57;
  --fg: #ece9fb; --soft: #cfcaf0; --muted: #9a94c4; --ink: #15132a;
  --gold: #f1c75b; --pink: #e0507f; --vio: #8f78f0; --up: #8ee0b0; --down: #f59bb0; --blurple: #5865f2;
  --felt: #17463c; --felt2: #0f3129; --cardbg: #fbfaf6; --red: #d23a4a;
  --title: "Bebas Neue", Impact, sans-serif; --body: "Space Grotesk", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; --round: Nunito, system-ui, sans-serif;
  --logo: url(/icon-192.png);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--fg); font-family: var(--body); background: var(--page); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
a { color: inherit; }
button { cursor: pointer; border: 0; color: inherit; font: inherit; border-radius: 0; }
button:disabled { cursor: default; opacity: .35; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hidden { display: none !important; }
.top { display: flex; gap: 14px; align-items: flex-start; }
.brand { display: flex; align-items: stretch; }
.brand .lg { display: block; width: 92px; height: 78px; flex: none; }
.brand h1 { font: 400 54px/.9 var(--title); letter-spacing: .02em; margin: 6px 0 6px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.links a { text-decoration: none; }
.me { margin-left: auto; display: flex; align-items: center; gap: 10px; font: 700 14px var(--body); color: var(--soft); margin-top: 10px; white-space: nowrap; }
.me .bal { font: 600 13px var(--mono); color: var(--gold); }
.av { --h: 260; position: relative; width: 30px; height: 30px; flex: none; display: grid; place-items: center; overflow: hidden; font: 900 12px var(--round); background: hsl(var(--h) 75% 82%); color: hsl(var(--h) 45% 25%); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.panel { background: var(--panel); padding: 0 18px 16px; margin-top: 16px; }
.panel h2 { display: inline-block; font: 400 26px/1 var(--title); letter-spacing: .06em; color: #fff; background: var(--vio); margin: 0 0 10px -18px; padding: 7px 26px 3px 18px; clip-path: polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%); }
.panel h2.g { background: var(--gold); color: var(--ink); } .panel h2.p { background: var(--pink); }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; line-height: 1.45; }
.cbtn { display: inline-block; font: 400 19px var(--title); letter-spacing: .08em; padding: 8px 18px 6px; background: var(--pink); color: #fff; clip-path: polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%); text-decoration: none; }
.cbtn.ghost { background: var(--panel2); color: var(--fg); } .cbtn.up { background: var(--up); color: #0e2a1c; } .cbtn.gold { background: var(--gold); color: var(--ink); }
.dbtn { display: inline-flex; align-items: center; gap: 10px; background: var(--blurple); color: #fff; font: 700 15px var(--body); padding: 10px 16px; text-decoration: none; }
.dbtn svg { width: 20px; height: 20px; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 14px; margin: 6px 0 14px; }
.form label { display: grid; gap: 4px; font: 400 15px var(--title); letter-spacing: .12em; color: var(--gold); }
select { background: var(--panel2); color: var(--fg); border: 0; padding: 8px 8px; font: 500 14px var(--mono); border-radius: 0; }
.err { background: rgba(224,80,127,.15); border-left: 4px solid var(--pink); padding: 8px 12px; margin-top: 12px; font-size: 13.5px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel2); border-left: 4px solid var(--pink); padding: 10px 14px; font-size: 14px; z-index: 60; max-width: min(92vw, 520px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }

/* table bar */
.tbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); padding: 8px 12px; font-size: 13px; color: var(--soft); margin-top: 16px; position: relative; }
.live { font: 600 11px var(--mono); background: var(--panel2); color: var(--muted); padding: 2px 6px; }
.live.on { background: var(--pink); color: #fff; }
.tbar .gm { font: 400 22px var(--title); letter-spacing: .06em; color: var(--fg); }
.tbar .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.tbtn { font: 400 15px var(--title); letter-spacing: .1em; background: var(--panel2); padding: 5px 12px 3px; }
.tbtn.on { background: var(--gold); color: var(--ink); }
.drop { position: absolute; right: 0; top: 100%; z-index: 30; width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.55); padding: 4px 14px 14px; }
.drop .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.drop .row label { color: var(--soft); }
.drop .row select { padding: 5px 6px; font-size: 12.5px; }
.drop .hb { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.drop .hb button { font: 400 16px var(--title); letter-spacing: .08em; padding: 8px 6px 6px; background: var(--panel2); }
.drop .hb .go { background: var(--pink); color: #fff; }
.drop .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.4; }

/* felt */
.felt { position: relative; aspect-ratio: 2 / 1.22; background: radial-gradient(120% 90% at 50% 0%, var(--felt), var(--felt2)); border: 10px solid #2b2150; border-top-width: 0; border-radius: 0 0 50% 50% / 0 0 34% 34%; overflow: hidden; }
.dealer { position: absolute; left: 50%; top: 3%; transform: translateX(-50%); text-align: center; display: grid; justify-items: center; gap: 4px; }
.lbl { font: 400 14px var(--title); letter-spacing: .14em; color: rgba(255,255,255,.55); }
.lbl b { color: var(--gold); font-weight: 400; margin-left: 4px; }
.rules { position: absolute; left: 50%; top: 23%; transform: translateX(-50%); font: 400 13px var(--title); letter-spacing: .16em; color: rgba(241,199,91,.55); white-space: nowrap; }
.status { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); text-align: center; width: 70%; pointer-events: none; }
.status .big { font: 400 clamp(20px, 2.6vw, 30px)/1 var(--title); letter-spacing: .06em; color: #fff; }
.status .sm { font-size: 12.5px; color: rgba(255,255,255,.72); margin-top: 4px; min-height: 1.3em; }
.ltb { display: flex; gap: 5px; justify-content: center; margin-top: 6px; }

/* cards (four-color deck like the poker room) */
.cards { display: flex; justify-content: center; }
.cd { width: 44px; height: 62px; background: var(--cardbg); color: #1b1b1b; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 900 20px/1 var(--round); box-shadow: 0 3px 8px rgba(0,0,0,.4); flex: none; }
.cd i { font-style: normal; font-size: 17px; margin-top: 2px; }
.cd.su-h { color: var(--red); } .cd.su-d { color: #2c63d6; } .cd.su-c { color: #1f8a4c; }
.cd.back { background: repeating-linear-gradient(45deg, #5a40ad 0 6px, #6e52c8 6px 12px); border: 3px solid var(--cardbg); }
.cd.ph { background: rgba(0,0,0,.18); box-shadow: none; border: 2px dashed rgba(255,255,255,.12); }
.cards .cd + .cd { margin-left: -20px; }
/* overlapped seat cards show their corner index, like a real fan of cards */
.seat .cards .cd { justify-content: flex-start; align-items: flex-start; padding: 4px 0 0 5px; font-size: 18px; } .seat .cards .cd i { font-size: 14px; margin: 1px 0 0 1px; }
.cards .cd:nth-child(odd) { transform: rotate(-3deg); } .cards .cd:nth-child(even) { transform: rotate(3deg) translateY(1px); }
.cd.in { animation: deal .4s cubic-bezier(.2,.8,.3,1) both; }
@keyframes deal { from { translate: 0 -150px; rotate: -10deg; opacity: 0; } to { translate: 0 0; rotate: 0deg; opacity: 1; } }
.cards.sm .cd { width: 34px; height: 48px; font-size: 15px; } .cards.sm .cd i { font-size: 13px; } .cards.sm .cd + .cd { margin-left: -17px; }
.dealer .cd { width: 52px; height: 73px; font-size: 24px; } .dealer .cd i { font-size: 20px; } .dealer .cards .cd + .cd { margin-left: -14px; }
.ltb .cd { width: 46px; height: 65px; transform: none !important; } .ltb .cards .cd + .cd { margin-left: 0; }
@media (hover: hover) { .cd:not(.back):not(.ph) { cursor: zoom-in; transition: scale .15s; } .cd:not(.back):not(.ph):hover { scale: 1.5; z-index: 6; position: relative; } }

/* seats: cards up top, bet, then the poker room's nameplate (pfp in its border + bar wash + sticker + title tab) */
.seat { position: absolute; transform: translate(-50%, -100%); display: grid; justify-items: center; gap: 3px; width: 20%; z-index: 2; }
.seat .hands { display: flex; gap: 8px; justify-content: center; align-items: flex-end; min-height: 66px; position: relative; }
.hand { display: grid; justify-items: center; gap: 2px; position: relative; }
.hand.cur::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: -5px; height: 3px; background: var(--gold); }
.tot { font: 600 11px var(--mono); background: rgba(0,0,0,.6); color: #fff; padding: 1px 5px; }
.tot.free { background: var(--up); color: #0e2a1c; }
.res { font: 400 15px/1 var(--title); letter-spacing: .06em; padding: 3px 7px 1px; transform: skewX(-10deg); white-space: nowrap; animation: pop .3s both; }
@keyframes pop { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
.res.w { background: var(--up); color: #0e2a1c; } .res.l { background: var(--down); color: #3a0d1c; } .res.p { background: var(--soft); color: var(--ink); } .res.bj { background: var(--gold); color: var(--ink); }
.act { margin-bottom: 4px; font: 900 10.5px var(--round); letter-spacing: .04em; background: var(--panel2); color: var(--fg); padding: 2px 6px; white-space: nowrap; text-transform: uppercase; min-height: 17px; }
.act.none { visibility: hidden; }
.act.hot { background: var(--pink); color: #fff; } .act.fold { background: #3a3560; color: var(--muted); } .act.gold { background: var(--gold); color: var(--ink); }
.bets { display: flex; gap: 4px; align-items: center; min-height: 20px; flex-wrap: wrap; justify-content: center; }
.stk { position: relative; width: 18px; display: inline-block; }
.stk i { position: absolute; left: 0; width: 18px; height: 7px; border-radius: 50%; border: 1px dashed rgba(255,255,255,.75); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
.k1 { background: #eee; } .k5 { background: #d23a4a; } .k25 { background: #2e9a5c; } .k100 { background: #222; } .k500 { background: #8e5bd6; }
.btag { font: 400 13px/1 var(--title); letter-spacing: .06em; background: #120f26; color: #fff; padding: 3px 7px 1px; transform: skewX(-10deg); white-space: nowrap; }
.btag.free { background: var(--up); color: #0e2a1c; } .btag.side { background: var(--vio); } .btag.play { background: var(--gold); color: var(--ink); }
.st-row { display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center; }
.pfw { position: relative; flex: none; }
.st-np { position: relative; flex: 1; min-width: 0; max-width: 150px; }
.st-name { position: relative; display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 4px 8px 4px 7px; background: #1d1a37; border-left: 3px solid #4a4380; }
.st-name b { font: 700 12.5px/1.2 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-name span.sk { font: 600 12px/1.2 var(--mono); color: var(--gold); white-space: nowrap; }
.st-name .pl-bg { opacity: .55; }
.st-stk { position: absolute; right: -8px; bottom: calc(100% - 4px); transform: rotate(8deg); z-index: 5; line-height: 0; pointer-events: none; }
.st-stk .pl-stk { width: 24px; height: 24px; margin: 0; }
.st-ttl { justify-self: start; max-width: 100%; margin-top: -1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 12px/1 var(--title); letter-spacing: .09em; text-transform: uppercase; color: var(--ink); background: var(--tc); padding: 3px 12px 1px 7px; clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 100%, 0 100%); }
.seat.you .st-name { border-left-color: var(--gold); }
.seat.turn .st-name { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(241,199,91,.4); }
.seat.out .pfw, .seat.out .st-np, .seat.out .st-ttl { opacity: .45; }
.tmr { width: 100%; height: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
.tmr i { display: block; height: 100%; background: var(--up); animation: drain linear forwards; transform-origin: left; }
@keyframes drain { from { transform: scaleX(1); } 80% { background: var(--up); } to { transform: scaleX(0); background: var(--pink); } }
.tmr.none { visibility: hidden; }
.sitbtn { font: 400 16px var(--title); letter-spacing: .12em; color: rgba(255,255,255,.75); background: rgba(0,0,0,.25); border: 1px dashed rgba(255,255,255,.35); padding: 10px 16px 8px; }
.sitbtn:hover { background: rgba(0,0,0,.4); color: #fff; }
.empty { font: 400 14px var(--title); letter-spacing: .12em; color: rgba(255,255,255,.3); border: 1px dashed rgba(255,255,255,.18); padding: 9px 12px 7px; }

/* the dock: fixed height in every state, so nothing jumps */
.dock { background: var(--panel); height: 128px; display: grid; grid-template-rows: auto 1fr; padding: 10px 12px; gap: 8px; }
.dock .info { font-size: 13px; color: var(--soft); display: flex; gap: 10px; align-items: center; min-height: 20px; }
.dock .info .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.dock .info .bal { font: 600 13px var(--mono); color: var(--gold); }
.dock .info button.lk { background: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 0; }
.btns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.ab { font: 400 20px var(--title); letter-spacing: .08em; background: var(--panel2); color: var(--fg); padding: 8px 6px 6px; min-height: 52px; }
.ab.go { background: var(--pink); color: #fff; } .ab.up { background: var(--up); color: #0e2a1c; } .ab.gold { background: var(--gold); color: var(--ink); }
.ab small { display: block; font: 500 10.5px var(--mono); letter-spacing: 0; opacity: .85; }
.ab.ghost { visibility: hidden; }
.dock .center { grid-column: 1 / -1; display: grid; place-items: center; }

.lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.log div { padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--soft); font-size: 13px; }
.howto li { margin: 4px 0; font-size: 13px; color: var(--soft); line-height: 1.45; }

@media (max-width: 900px) { .lower { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  .brand h1 { font-size: 40px; } .brand .lg { width: 70px; height: 62px; }
  .me .nm { display: none; }
  .felt { aspect-ratio: auto; height: 720px; border-radius: 0 0 40% 40% / 0 0 9% 9%; border-width: 0 6px 8px; }
  .seat { width: 32%; }
  .rules { top: 18%; font-size: 11.5px; white-space: normal; width: 92%; text-align: center; }
  .status { top: 22%; width: 94%; }
  .dealer .cd { width: 44px; height: 62px; font-size: 20px; }
  .cd { width: 38px; height: 54px; font-size: 17px; } .cd i { font-size: 14px; }
  .ltb .cd { width: 40px; height: 57px; }
  .st-name b { font-size: 11px; } .st-name { padding: 3px 5px; } .st-name span.sk { display: none; }
  .st-row { gap: 3px; } .st-np { max-width: calc(100% - 37px); } .st-ttl { font-size: 10.5px; }
  .seat .cards .cd { width: 34px; height: 48px; font-size: 15px; padding: 3px 0 0 4px; } .seat .cards .cd i { font-size: 12px; } .seat .cards .cd + .cd { margin-left: -18px; }
  .seat .cards.sm .cd { width: 28px; height: 40px; font-size: 13px; } .seat .cards.sm .cd + .cd { margin-left: -15px; }
  .bets .btag { font-size: 11.5px; }
  .ab { font-size: 18px; }
  .tbar .r { margin-left: 0; width: 100%; justify-content: flex-end; }
}
@media (prefers-reduced-motion: reduce) { .cd.in, .res { animation: none; } }

<div class="wrap">
  <header class="top">
    <div class="brand"><a class="lg" href="/" aria-label="Dashboard"></a><div><h1><a href="/live" style="text-decoration:none">Live Tables</a></h1>
      <nav class="links"><a class="recap-link casino-link" href="/casino">🎰 Casino</a><a class="recap-link" href="/poker">♠️ Poker Room</a></nav></div></div>
    <div class="me hidden" id="me"></div>

<script type="module">
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '−' : '') + '$' + (Math.round(Math.abs(n) * 100) / 100).toLocaleString('en-US');
const hue = n => [...String(n)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const initials = n => String(n).split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const av = (id, name) => `<span class="av" style="--h:${hue(name)}">${esc(initials(name))}${id ? `<img src="/api/avatar?id=${esc(id)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
const DISCORD_SVG = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.5C.6 9-.3 13.6.1 18.1A19.8 19.8 0 0 0 6.1 21l1.3-2.1a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.7 19.7 0 0 0 6-3c.5-5.2-.9-9.8-3.6-13.7zM8.3 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm7.4 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>';
const GAMES = { bj: 'Blackjack', fb: 'Free Bet Blackjack', uth: "Ultimate Texas Hold'em" }, SHORT = { bj: 'Blackjack', fb: 'Free Bet', uth: 'UTH' };
const LIMITS = [[5, 100], [10, 250], [25, 500]], CARD_MS = 650;
const RULES = { bj: 'Blackjack pays 3 to 2 · dealer stands on 17', fb: 'Free doubles 9–11 · free splits · dealer 22 pushes', uth: 'Dealer needs a pair to open the ante' };
const API = window.LIVE_API || '/api/live';

// ---------- state ----------
let S = null, skew = 0, err = '', drop = false, busy = false, tickT = 0, pollT = 0, rt = null, liveOn = false;
// animations survive redraws: each one is timed from when it first showed (key -> time), so a redraw mid-way carries on instead of restarting
let seen = new Map(), seenRound = -1;
const ANIM_MS = 450;
/** class + style for an animation that should start `delay` ms after `key` first appeared ('' once it has finished) */
function anim(key, delay) { const now = Date.now(); if (!seen.has(key)) seen.set(key, now); const el = now - seen.get(key); return el < delay + ANIM_MS ? { on: true, style: `animation-delay:${delay - el}ms` } : { on: false, style: '' }; }
let pend = { bet: 0, side: 0 }; try { Object.assign(pend, JSON.parse(localStorage.getItem('lt:bet') || '{}')); } catch (e) {}
let PLATES = null;
import('/plates.js').then(m => m.loadouts().then(lo => { PLATES = { ...lo, bits: m.bits }; render(); })).catch(() => {});
const eqOf = id => PLATES && PLATES.L ? PLATES.byId[id] || null : null;
const titleOf = id => { const eq = eqOf(id), it = eq && eq['Title'] && PLATES.L.itemFor(eq['Title']); return it ? { name: it.name, col: PLATES.L.TCOL[it.tier] || '#a9a3c9' } : null; };
const plateOf = id => (PLATES && PLATES.L && PLATES.bits(PLATES.L, eqOf(id))) || { bar: '', sticker: '', face: h => h };
const PHONE = matchMedia('(max-width: 640px)'); PHONE.addEventListener?.('change', () => render());
const T = () => S && S.table;
const serverNow = () => Date.now() + skew;

      : t.phase === 'done' ? (s.locked ? 'Round over' : 'Bets open in a moment') : '';
    b = [ghost(), ghost(), ghost(), ghost()];
  }
  return `<div class="info"><span>${info}</span><span class="right">${bal}</span></div><div class="btns">${b.join('')}</div>`;
}
function lowerHTML(t) {
  return `<div class="lower"><section class="panel"><h2 class="p">Table log</h2><div class="log">${t.log.length ? t.log.map(l => `<div>${esc(l)}</div>`).join('') : '<div>Nothing yet.</div>'}</div></section>
    <section class="panel"><h2>How it plays</h2><ul class="howto">
      <li>Bets close ${t.cfg.betClock} seconds after the first one, or as soon as everyone seated is in.</li>
      <li>Everyone plays at once against the same dealer, each with a ${t.cfg.clock} second clock. Out of time = ${t.game === 'uth' ? 'check (fold on the river)' : 'stand'}.</li>
      <li>${t.game === 'uth' ? 'Bet 4x before the flop, 2x on the flop or 1x on the river (or fold). The deal holds 1x your ante so the river bet is always covered.' : t.game === 'fb' ? 'Free doubles on hard 9, 10 and 11, free splits on any pair but 10s. A free bet pays even money if it wins and costs nothing if it loses. Dealer 22 pushes.' : 'Split up to 6 hands, double on any first two cards. Blackjack pays 3 to 2.'}</li>
      <li>Same payouts as the solo game. Every hand counts for rakeback, the jackpot and titles.</li>
      <li>Sitting out 5 rounds in a row stands you up. Your chips never stay on the table.</li></ul></section></div>`;
}
function bindTable() {
  const t = T();
  document.querySelectorAll('[data-sit]').forEach(b => b.onclick = () => act({ a: 'sit', seat: +b.dataset.sit }));
  const lv = $('#leaveBtn'); if (lv) lv.onclick = () => act({ a: 'leave' });
  const hb = $('#hostBtn'); if (hb) hb.onclick = e => { e.stopPropagation(); drop = !drop; render(); };
  const d = $('#drop');
  if (d) {
    d.onclick = e => e.stopPropagation();
    $('#hGame').onchange = e => act({ a: 'game', game: e.target.value });
    $('#hMin').onchange = e => act({ a: 'cfg', cfg: { min: +e.target.value } });
    $('#hPause').onclick = () => act({ a: 'pause', on: !t.pause });
    $('#hClose').onclick = () => { drop = false; act({ a: 'close' }); };
  }
  $('#dock').onclick = e => {
    const btn = e.target.closest('button'); if (!btn || btn.disabled) return;
    if (btn.dataset.m) return act({ a: 'move', do: btn.dataset.m });
    const k = btn.dataset.b, step = t.cfg.min; if (!k) return;
    if (k === 'minus') pend.bet = Math.max(t.cfg.min, pend.bet - step);
    if (k === 'plus') pend.bet = Math.min(t.betMax, pend.bet + step);
    if (k === 'side') { const opts = [0, step, step * 2, step * 5].filter(x => x <= t.sideMax); pend.side = opts[(opts.indexOf(pend.side) + 1) % opts.length] || 0; }
    try { localStorage.setItem('lt:bet', JSON.stringify(pend)); } catch (er) {}
    if (k === 'bet') return act({ a: 'bet', bet: pend.bet, side: pend.side });
    render();
  };
}
document.addEventListener('click', () => { if (drop) { drop = false; render(); } });
// countdown text + nothing else moves between updates
setInterval(() => { const t = T(); if (!t) return; document.querySelectorAll('[data-cd="bet"]').forEach(e => { e.textContent = Math.max(0, Math.ceil((t.deadline - serverNow()) / 1000)) + 's'; }); }, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden) api().catch(() => {}); });

(async function start() {
  const q = new URLSearchParams(location.search);
  if (q.get('err')) err = { cancelled: 'Sign-in was cancelled.', setup: "Discord sign-in isn't set up yet.", stranger: "That Discord account isn't one the club knows yet." }[q.get('err')] || 'Sign-in failed. Try again.';
  try { await api(); } catch (e) { $('#view').innerHTML = '<p class="hint" style="margin-top:20px">Couldn\'t reach the table. Refresh to try again.</p>'; }
  poll();
  if (S && S.ably && !window.LIVE_API) { const sc = document.createElement('script'); sc.src = '/ably.min.js'; sc.onload = connectLive; document.head.appendChild(sc); }
})();
