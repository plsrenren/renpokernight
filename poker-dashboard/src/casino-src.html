<style>
/* Casino page: the Discord bot's games (blackjack, Free Bet blackjack, UTH, baccarat) with the same chips. Sign in with Discord.
   Talks to /api/casino and /api/login (served by api/_casino.js). Late Show look built in; lateshow.css is linked last like every page. */
:root {
  --page: #15132a; --panel: #1d1a37; --panel2: #2a2550; --line: #332e57;
  --fg: #ece9fb; --soft: #cfcaf0; --muted: #9a94c4;
  --gold: #f1c75b; --pink: #e0507f; --vio: #8f78f0; --up: #8ee0b0; --down: #f59bb0; --blurple: #5865f2;
  --title: "Bebas Neue", Impact, sans-serif; --body: "Space Grotesk", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --logo: url(/icon-192.png);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--fg); font-family: var(--body); background: var(--page); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px 40px; }
a { color: inherit; }
button { cursor: pointer; border: 0; color: inherit; }
button:disabled { cursor: default; opacity: .4; }
/* header */
.top { display: flex; gap: 14px; align-items: flex-start; }
.brand { display: flex; align-items: stretch; }
.brand .lg { display: block; width: 92px; height: 78px; flex: none; }
.brand h1 { font: 400 54px/.9 var(--title); letter-spacing: .02em; margin: 6px 0 6px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.links a { text-decoration: none; }
.me { margin-left: auto; display: flex; align-items: center; gap: 10px; font: 700 14px var(--body); color: var(--soft); margin-top: 10px; white-space: nowrap; }
.me button { background: none; color: var(--muted); font: 500 12px var(--body); letter-spacing: 0; padding: 0; text-decoration: underline; }
/* avatars: initials underneath, Discord pfp on top when it loads */
.av { --h: 260; position: relative; width: 30px; height: 30px; flex: none; display: grid; place-items: center; overflow: hidden; font: 900 12px Nunito, sans-serif; background: hsl(var(--h) 75% 82%); color: hsl(var(--h) 45% 25%); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* panels + tiles */
.panel { background: var(--panel); padding: 0 18px 16px; margin-top: 16px; }
.panel h2 { display: inline-block; font: 400 26px/1 var(--title); letter-spacing: .06em; color: #fff; background: var(--vio); margin: 0 0 10px -18px; padding: 7px 26px 3px 18px; clip-path: polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%); }
.panel h2.g { background: var(--gold); color: #15132a; } .panel h2.p { background: var(--pink); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.strip { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin-top: 16px; }
.tl { background: var(--panel); border-left: 4px solid var(--vio); padding: 12px 16px; min-width: 0; }
.tl:first-child { border-left-color: var(--gold); background: linear-gradient(100deg, #3a2a6e, #a23b58); }
.tl .k { font: 400 17px var(--title); letter-spacing: .12em; color: var(--soft); }
.tl .v { font: 400 46px/.95 var(--title); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl .s { font: 500 12px var(--mono); color: var(--soft); margin-top: 4px; }
.cbtn { display: inline-block; font: 400 19px var(--title); letter-spacing: .08em; padding: 8px 18px 6px; background: var(--pink); color: #fff; clip-path: polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%); text-decoration: none; }
.cbtn.up { background: var(--up); color: #0e2a1c; } .cbtn.gold { background: var(--gold); color: #15132a; } .cbtn.ghost { background: var(--panel2); color: var(--fg); } .cbtn.vio { background: var(--vio); }
.cbtn.big { font-size: 22px; padding: 10px 24px 8px; }
/* game tiles */
.games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.game { background: var(--panel2); padding: 12px; display: flex; flex-direction: column; gap: 6px; border-top: 4px solid var(--c); text-decoration: none; position: relative; min-height: 150px; }
.game:hover { background: #332d60; }
.game .ic { font-size: 30px; line-height: 1; }
.game b { font: 400 26px/1 var(--title); letter-spacing: .04em; }
.game span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.game .go { margin-top: auto; font: 400 15px var(--title); letter-spacing: .1em; color: var(--c); }
.game.soon { opacity: .55; pointer-events: none; }
.shopln { display: flex; align-items: center; gap: 12px; margin: 14px 0; padding: 12px 14px; background: var(--panel2); border-left: 4px solid var(--gold); text-decoration: none; color: inherit; }
.shopln:hover { background: #332d60; }
.shopln .ic { font-size: 28px; line-height: 1; }
.shopln b { display: block; font: 400 24px/1 var(--title); letter-spacing: .04em; }
.shopln span { font-size: 12px; color: var(--muted); }
.shopln .go { margin-left: auto; font: 400 15px var(--title); letter-spacing: .1em; color: var(--gold); white-space: nowrap; }
/* leaderboard + feed */
.cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
.lb { width: 100%; border-collapse: collapse; }
.lb td { padding: 5px 6px; border-bottom: 1px solid #2a2550; font-size: 14px; }
.lb td.rk { font: 400 20px var(--title); color: var(--muted); text-align: center; background: #2a2550; width: 34px; }
.lb tr:first-child td.rk { background: var(--gold); color: #15132a; }
.lb td.n { font-weight: 700; }
.lb td.n .nw { display: flex; align-items: center; gap: 8px; min-width: 0; } /* flex lives on an inner span: a flex td stops being a table cell */
.lb td.m { text-align: right; font: 600 14px var(--mono); white-space: nowrap; }
.lb tr.you td { background: rgba(241,199,91,.08); }
.youtag { font: 600 10px var(--mono); color: #15132a; background: var(--gold); padding: 1px 5px; }
.feed div { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 5px 0; border-bottom: 1px solid #2a2550; }
.feed small { color: var(--muted); font-size: 11px; }
.feed .who { min-width: 0; }
.feed .st { display: block; font: 500 11px var(--mono); color: var(--soft); }
.feed em { display: block; font-style: normal; font-size: 11px; color: var(--gold); white-space: normal; }
.earn { background: var(--panel); border-left: 4px solid var(--gold); margin-top: 16px; }
.earn summary { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; list-style: none; }
.earn summary::-webkit-details-marker { display: none; }
.earn summary b { font: 400 22px var(--title); letter-spacing: .06em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.earn summary span { color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.earn summary i { margin-left: auto; font: 400 17px var(--title); letter-spacing: .08em; color: var(--gold); font-style: normal; white-space: nowrap; }
.earn summary i::after { content: ' ▾'; } .earn[open] summary i::after { content: ' ▴'; }
.earn .groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 28px; padding: 0 16px 14px; font-size: 13px; }
.earn h3 { font: 400 16px var(--title); letter-spacing: .08em; color: var(--vio); margin: 4px 0 2px; }
.earn .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid #2a2550; }
.earn .row b { font: 500 13px var(--mono); color: var(--gold); white-space: nowrap; }
.earn .hint { padding: 6px 16px 12px; margin: 0; }
@media (max-width: 640px) { .earn .groups { grid-template-columns: 1fr; } .earn summary span { display: none; } .earn summary b { font-size: 19px; } }
.feed .amt { margin-left: auto; font-family: var(--mono); white-space: nowrap; }
.src { font: 600 10px var(--mono); padding: 1px 5px; background: #2a2550; color: var(--muted); }
.src.d { background: rgba(88,101,242,.25); color: #c9cdfb; }
.src.n { background: rgba(241,199,91,.22); color: var(--gold); }
.pos { color: var(--up); } .neg { color: var(--down); }
/* signed out */
.hero { margin-top: 16px; background: linear-gradient(100deg, #3a2a6e, #a23b58); border-left: 6px solid var(--gold); padding: 20px 22px 22px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.hero h2 { font: 400 50px/.95 var(--title); margin: 0 0 8px; letter-spacing: .02em; }
.hero p { margin: 0; color: #eee; font-size: 15px; line-height: 1.45; max-width: 560px; }
.dbtn { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--blurple); color: #fff; font: 800 17px Nunito, sans-serif; padding: 14px 22px; text-decoration: none; }
.dbtn svg { width: 24px; height: 24px; flex: none; }
.fine { font-size: 11.5px; color: #ddd; margin-top: 8px; opacity: .85; line-height: 1.4; max-width: 300px; }
.note { margin-top: 16px; padding: 10px 14px; border-left: 4px solid var(--down); background: rgba(245,155,176,.1); font-size: 14px; line-height: 1.45; }
.note.ok { border-left-color: var(--up); background: rgba(142,224,176,.1); }
/* tables */
.tablebar { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; flex-wrap: wrap; }
.tablebar h2 { margin: 0; font: 400 34px/1 var(--title); letter-spacing: .04em; }
.bal { font: 400 22px var(--title); letter-spacing: .06em; color: var(--soft); white-space: nowrap; }
.bal b { color: var(--gold); font-weight: 400; font-size: 30px; margin-left: 6px; }
.bal i { font-style: normal; font-size: 20px; margin-left: 6px; }
.felt { background: radial-gradient(120% 90% at 50% 0%, #2f5a45, #173326 70%); border: 6px solid #3a2a6e; outline: 3px solid var(--gold); padding: 18px 22px 20px; position: relative; margin-top: 12px; min-height: 330px; }
.felt .lbl { font: 400 17px var(--title); letter-spacing: .14em; color: #cfe9da; display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; min-height: 30px; white-space: nowrap; }
.felt .lbl .tot { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.felt .lbl.on { color: var(--gold); }
.felt .lbl.sum { white-space: normal; line-height: 1.25; } /* baccarat result line wraps on small phones instead of running off the felt */
.tot { font: 600 14px var(--mono); background: #0e1f17; color: #fff; padding: 3px 9px; letter-spacing: 0; }
.tag { font: 900 11px Nunito, sans-serif; letter-spacing: .08em; padding: 2px 7px; }
.tag.win, .tag.bj { background: var(--up); color: #0e2a1c; } .tag.bj { background: var(--gold); color: #2a1f00; }
.tag.lose, .tag.bust, .tag.fold { background: var(--down); color: #3a0d18; } .tag.push { background: var(--muted); color: #16132b; }
.hand { display: flex; gap: 10px; margin: 8px 0 18px; flex-wrap: wrap; }
.hands { display: flex; gap: 34px; flex-wrap: wrap; }
/* 3 to 6 split hands: a grid of smaller cards that fan out (rank in the corner), so 6 hands fit on a phone */
.hands.many { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 18px; }
.hands.many .lbl { font-size: 15px; gap: 6px; flex-wrap: wrap; white-space: normal; min-height: 0; }
.hands.many .hand { flex-wrap: nowrap; gap: 0; margin: 6px 0 12px; }
.hands.many .card { width: 46px; height: 64px; font-size: 19px; align-items: flex-start; justify-content: flex-start; padding: 5px 0 0 6px; box-shadow: -2px 0 6px rgba(0,0,0,.3); }
.hands.many .card i { font-size: 14px; margin-top: 1px; }
.hands.many .card + .card { margin-left: -18px; }
.ftag { font: 900 11px Nunito, sans-serif; letter-spacing: .08em; padding: 2px 7px; background: var(--gold); color: #2a1f00; }
.cbtn.free { background: var(--up); color: #0e2a1c; }
/* Double Down Madness (Nov 26 2026): orange multiplier tag on the bet, side bet results in one row */
:root { --mad: #ff9f5a; }
.ftag.dd { background: var(--mad); color: #2a1200; }
.felt .lbl.sides2 { gap: 16px; flex-wrap: wrap; white-space: normal; font-size: 15px; }
.felt .sb { display: inline-flex; gap: 6px; align-items: center; }
.card { width: 74px; height: 104px; background: #f6f3ea; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 900 32px/1 Nunito, sans-serif; color: #1b1b1b; box-shadow: 0 4px 10px rgba(0,0,0,.35); flex: none; position: relative; }
/* four-color deck from the shared table kit: hearts red, diamonds blue, clubs green, spades black */
.card.su-h { color: var(--tk-red); } .card.su-d { color: var(--tk-blue); } .card.su-c { color: var(--tk-green); } .card i { font-style: normal; font-size: 28px; margin-top: 4px; }
.card.back { background: repeating-linear-gradient(45deg, #5a40ad 0 7px, #6e52c8 7px 14px); border: 4px solid #f6f3ea; }
.card.empty { background: rgba(255,255,255,.06); box-shadow: none; border: 2px dashed rgba(255,255,255,.18); animation: none; }
/* smooth dealing (see choreograph()): new cards fly from the shoe in deal order; a face-down card turns over */
.card.flip { animation: flipx .38s ease-in-out both; }
.card.flip::after { content: ""; position: absolute; inset: -4px; background: repeating-linear-gradient(45deg, #5a40ad 0 7px, #6e52c8 7px 14px); border: 4px solid #f6f3ea; animation: hideback .38s linear both; animation-delay: inherit; }
@keyframes flipx { 0% { transform: scaleX(1); } 50% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
@keyframes hideback { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.shoe { position: absolute; right: 14px; top: 12px; width: 50px; height: 70px; background: repeating-linear-gradient(45deg, #5a40ad 0 7px, #6e52c8 7px 14px); border: 3px solid #f6f3ea; box-shadow: 3px 3px 0 #2c1f63, 6px 6px 0 #1f1647; }
.late-hide { visibility: hidden; }
.late-show { animation: fadein .25s ease-out both; }
@keyframes fadein { from { opacity: 0; } }
.wait { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent) no-repeat; background-size: 40% 100%; animation: sweep .8s linear infinite; opacity: 0; transition: opacity .15s; }
.wait.on { opacity: 1; }
@keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }
.slots.hold{pointer-events:none}.slots.hold .cbtn{filter:saturate(.6) brightness(.9);transition:filter .2s}
.slots { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.slots .cbtn { font-size: 22px; padding: 11px 8px 9px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cbtn { transition: transform .08s, filter .12s, opacity .15s; }
.cbtn:not(:disabled):active { transform: translateY(2px) scale(.97); filter: brightness(1.15); }
.cbtn.pressed:disabled { opacity: 1; filter: brightness(1.2); }
.bal .tk-snd { margin-left: 10px; font-size: 18px; vertical-align: 2px; }
.rules.stage { min-height: 3.2em; }
#balNum { font-variant-numeric: tabular-nums; }
.betchip { position: absolute; right: 26px; bottom: 22px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; } /* the bet: shared-kit chip stacks + amount tag */
.betchip .tk-stks { transform: scale(1.5); transform-origin: right bottom; margin-bottom: 4px; } .betchip .tk-amt { font-size: 22px; }
.result { position: absolute; right: 140px; top: 52%; transform: translateY(-50%) rotate(-4deg); background: var(--gold); color: #15132a; font: 400 54px/1 var(--title); padding: 10px 26px 4px; letter-spacing: .04em; box-shadow: 0 10px 30px rgba(0,0,0,.5); text-align: center; white-space: nowrap; }
.result.slide { animation: slide .42s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes slide { from { transform: translateY(-20%) rotate(-12deg); opacity: 0; } }
.result.flat.slide, .felt.bac .result.slide { animation-name: slide2; }
@keyframes slide2 { from { transform: translateY(20px) rotate(-8deg); opacity: 0; } }
.result.lost { background: var(--down); } .result.even { background: var(--muted); }
.result small { display: block; font: 600 15px var(--mono); padding-bottom: 6px; letter-spacing: 0; }
@keyframes pop { from { transform: translateY(-50%) rotate(-4deg) scale(.6); opacity: 0; } }
@keyframes pop2 { from { transform: rotate(-2deg) scale(.6); opacity: 0; } }
.result.flat, .felt.bac .result { position: static; display: inline-block; transform: rotate(-2deg); margin-top: 10px; }
.acts { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.acts .cbtn { font-size: 22px; padding: 11px 24px 9px; }
.chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chips .lab { font: 400 18px var(--title); letter-spacing: .08em; color: var(--soft); margin-right: 4px; min-width: 64px; }
/* betting = chip rack (Nov 25 2026, Renato's pick A, same as /live): tap a spot on the felt, tap chips to add, Undo / Clear / 2x, Deal on the right */
.ctlbox { min-height: 66px; margin-top: 14px; }
.ctlbox .slots { margin-top: 0; }
.rackb { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(150px, 240px); gap: 12px; align-items: center; background: var(--panel); padding: 6px 8px; }
.rack { display: flex; gap: 8px; }
.chip { width: 54px; height: 54px; display: grid; place-items: center; font: 400 18px/1 var(--title); color: #fff; letter-spacing: .02em; position: relative; flex: none; padding: 0;
  background: var(--c); box-shadow: inset 0 0 0 4px var(--c), inset 0 0 0 7px rgba(255,255,255,.85), 0 3px 0 rgba(0,0,0,.45); }
.chip::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 4px dashed rgba(255,255,255,.75); }
.chip span { position: relative; padding-top: 2px; }
html button.chip, html button.bspot { border-radius: 50%; } /* lateshow.css squares every button */
.chip.c1 { --c: #f2f2f2; color: #15132a; } .chip.c1::before { border-color: #3b6fd6; } .chip.c5 { --c: #d93a4a; } .chip.c25 { --c: #2e9e5b; } .chip.c100 { --c: #22202f; } .chip.c500 { --c: #8f78f0; }
.chip:disabled { opacity: .35; }
.chip:not(:disabled):active { transform: translateY(2px) scale(.97); filter: brightness(1.15); }
.tools { display: flex; gap: 6px; justify-content: flex-end; }
.tools .cbtn { font-size: 17px; padding: 9px 14px 7px; flex: 0 1 80px; text-align: center; }
.rackb .cbtn.deal { font-size: 22px; padding: 14px 10px 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rhint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; min-height: 1.4em; }
.bspots { position: absolute; right: 22px; bottom: 18px; display: flex; gap: 10px; align-items: flex-end; z-index: 1; }
.bspot { width: 84px; height: 84px; border: 3px solid rgba(241,199,91,.55); background: rgba(0,0,0,.16); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0;
  color: rgba(241,199,91,.9); font: 400 14px/1 var(--title); letter-spacing: .12em; transition: box-shadow .15s, border-color .15s; }
.bspot small { display: block; font: 500 9.5px var(--mono); letter-spacing: 0; color: #b9d8c7; margin-top: 3px; }
.bspot.sm { width: 66px; height: 66px; font-size: 12px; }
.bspot .tk-amt { font-size: 15px; padding: 2px 7px 0 5px; }

.bspot.bump { animation: bump .18s ease-out; } @keyframes bump { 50% { transform: scale(1.08); } }
html button.bspot.rect { border-radius: 0; width: auto; flex: 1; max-width: 200px; height: 74px; }
.felt.bac .bspots { position: static; justify-content: center; margin-top: 14px; }
.rules { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
.sync { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--soft); background: rgba(88,101,242,.16); border-left: 3px solid var(--blurple); padding: 8px 10px; }
.err { color: var(--down); font-size: 14px; margin-top: 10px; min-height: 1em; }
.lines { margin-top: 12px; display: grid; gap: 4px; font-size: 14px; }
.lines div { display: flex; gap: 8px; } .lines b { min-width: 56px; } .lines span:last-child { margin-left: auto; font-family: var(--mono); }

.side { background: var(--panel2); padding: 12px; text-align: left; border-top: 4px solid var(--c); }
.side b { display: block; font: 400 26px/1 var(--title); letter-spacing: .04em; }
.side span { font: 500 12px var(--mono); color: var(--muted); }
.side[aria-pressed="true"] { background: #3d3577; outline: 3px solid var(--c); }
.bacrow { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.bacrow .won { outline: 3px solid var(--gold); outline-offset: 6px; }
details.pay { margin-top: 10px; font-size: 13px; color: var(--soft); line-height: 1.5; white-space: pre-line; }
details.pay summary { cursor: pointer; font: 400 17px var(--title); letter-spacing: .08em; color: var(--gold); }
.hidden { display: none !important; }

<body>
<div class="wrap">
  <header class="top">

  </header>

  <main id="view"><p class="loading">Shuffling…</p></main>
</div>

<script src="/table-kit.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); // cents on every amount, site-wide (Renato, Nov 25 2026)
const signed = n => (n > 0 ? '+' : '') + money(n);
const hue = n => [...String(n)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const initials = n => String(n).split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const av = (id, name) => `<span class="av" style="--h:${hue(name)}">${esc(initials(name))}${id ? `<img src="/api/avatar?id=${esc(id)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
const SUIT = { S: '♠', H: '♥', D: '♦', C: '♣' };
const card = c => !c || c === 'XX' ? '<div class="card back"></div>' : c === '__' ? '<div class="card empty"></div>'
  : `<div class="card su-${c[1].toLowerCase()}">${c[0] === 'T' ? '10' : c[0]}<i>${SUIT[c[1]]}</i></div>`;
const DISCORD_SVG = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18 18 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.5C.6 9-.3 13.6.1 18.1A19.8 19.8 0 0 0 6.1 21l1.3-2.1a12.8 12.8 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.7 19.7 0 0 0 6-3c.5-5.2-.9-9.8-3.6-13.7zM8.3 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm7.4 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>';
const ERRS = { cancelled: 'Sign-in was cancelled.', expired: 'That sign-in link expired. Try again.', discord: "Discord didn't let the sign-in through. Try again in a moment.",
  setup: "Discord sign-in isn't switched on yet (the site needs its Discord client secret).",
  stranger: "That Discord account isn't one the club knows yet. Use /daily once in the Discord server, or ask Renato to add your Discord ID to the Members tab, then sign in again." };

// remembered bets (this browser only)
const pref = (k, d) => { try { const v = localStorage.getItem('cas.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const setPref = (k, v) => { try { localStorage.setItem('cas.' + k, JSON.stringify(v)); } catch (e) {} };

let S = null;                 // what /api/casino said
let T = { bj: null, fb: null, mad: null, uth: null, bac: null, err: '' };  // what's on each table (fb = Free Bet blackjack, mad = Double Down Madness)
let busy = false;
let shownBal = null;          // the balance currently on screen (it rolls to the real one)
let pressed = null;           // the button just tapped (stays lit while the table thinks)
// sounds + mute come from the shared table kit (/table-kit.js), same as the poker room and live tables
const K = window.TK, SND = K.SND;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

async function api(body) {
  const r = await fetch('/api/casino', body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin', cache: 'no-store' });
  let j = {}; try { j = await r.json(); } catch (e) { j = { err: 'Something went wrong. Try again.' }; }
  if (j.signedOut) { S.me = null; render(); }
  return j;
}
async function load() {
  S = await api();
  if (S.bj) T.bj = S.bj;
  if (S.fb) T.fb = S.fb;
  if (S.mad) T.mad = S.mad;
  if (S.uth) T.uth = S.uth;
  if (jpSeen === null) jpSeen = jpKey(S.jackpot && S.jackpot.last);
  render();
  jpRefresh();
}
const setBal = b => { if (S.me && typeof b === 'number') S.me.bal = b; };

async function play(body, apply, early) {
  if (busy) return; busy = true; T.err = ''; K.jpClear && K.jpClear(); render();
  if (early) early();   // something moves straight away while the server answers
  let jw = null;
  try {
    const j = await api(body);
    if (j.busy) return;
    if (j.err) { T.err = j.err; if (j.daily) S.me.daily = j.daily; return; }
    // a jackpot hit on this hand: the hand plays out on the losing balance first, then the gold card pays it (jpWin)
    jw = j.jackpot && j.jackpot.win > 0 && typeof j.bal === 'number' ? j.jackpot : null;
    setBal(jw ? Math.round((j.bal - jw.win) * 100) / 100 : j.bal); apply(j);
    jpTake(j.jp, !!jw);
  } catch (e) { T.err = "Couldn't reach the table. Check your connection."; }
  finally { busy = false; pressed = null; render(); }
  if (jw) jpWin(jw);
}

// ---------- jackpot win (Nov 26 2026, Renato's picks: the gold card on your own table + a banner when someone else hits it) ----------
// The card, banner, chips and sounds live in the table kit (jpCard / jpBanner). Game answers carry { jackpot } when your hand
// won the pot and { jp: { wins, last } } (the pot's last hit) so a hit by anyone shows here; see gameAct in api/_casino.js.
let jpSeen = null, lastEnd = 0;
const jpKey = l => l ? l.id + ':' + l.win : '';
const JP_FRESH = 10 * 60e3;   // "just hit" lasts 10 minutes
function jpTake(jp, mineNow) {
  if (!jp || !S) return;
  if (S.jackpot) { if (jp.last) S.jackpot.last = jp.last; if (jp.wins > (S.jackpot.wins || 0)) { S.jackpot.wins = jp.wins; S.jackpot.pot = S.jackpot.seed; } }
  const k = jpKey(jp.last);
  if (jpSeen === null) { jpSeen = k; return; }
  if (!k || k === jpSeen) return;
  jpSeen = k;
  if (mineNow || Date.now() - jp.last.at > JP_FRESH || document.getElementById('jpb')) return; // your own hand: the card shows it; lobby: its card shows it
  const you = S.me && jp.last.id === S.me.id;  // roulette: everyone's hits come from the spin, so yours shows as a banner
  setTimeout(() => K.jpBanner && K.jpBanner({ name: jp.last.name, win: jp.last.win, game: jp.last.game, you }), RL.spinning ? 6500 : lastEnd + 400);
}
function jpWin(jw) {
  const paid = () => { setBal(Math.round(((S.me.bal || 0) + jw.win) * 100) / 100); rollBal(0); if (window.SB) window.SB.bal(S.me.bal); };
  if (!K.jpCard) return paid();
  setTimeout(() => K.jpCard(document.querySelector('#view .felt'), { win: jw.win, toEl: document.getElementById('balNum') || document.getElementById('sb'), onPaid: paid }), lastEnd + 700);
}

// ---------- page frame ----------
function header() {
  // who you are + sign out live in the sign-in badge (badge.js) now; it just gets the newest balance
  if (S.me && window.SB) window.SB.bal(S.me.bal);
}
const route = () => (location.hash || '#').slice(1);
function render() {
  if (!S) return;
  header();
  const err = new URLSearchParams(location.search).get('err');
  $('#note').innerHTML = err && ERRS[err] ? `<div class="note">${esc(ERRS[err])}</div>` : '';
  const r = route(), v = $('#view');
  const before = onTable();
  if (!S.me || !['blackjack', 'freebet', 'madness', 'uth', 'baccarat', 'roulette'].includes(r)) v.innerHTML = lobby();
  else v.innerHTML = r === 'blackjack' ? blackjack('bj') : r === 'freebet' ? blackjack('fb') : r === 'madness' ? blackjack('mad') : r === 'uth' ? uth() : r === 'roulette' ? roulette() : baccarat();
  onTable(before);
  wire();
  choreograph(before);
  rlAfterRender();
}
// Only newly dealt cards (and a new result stamp) animate. Cards already on the table keep still when the page redraws.
// Without a set: returns what's on the table now. With one: marks the cards that were already there.
function onTable(before) {
  const now = new Set(), f = document.querySelector('.felt'), hid = route() + '|' + (f ? f.dataset.hid : '');
  now.backs = new Set();
  const mark = (el, key) => { if (before) { if (before.has(key)) el.classList.add('still'); } else now.add(key); };
  document.querySelectorAll('.felt .hand').forEach((h, i) => [...h.children].forEach((c, j) => {
    const cls = c.className.replace(/ (still|flip)/g, '');
    mark(c, `${hid}|${i}|${j}|${cls}|${c.textContent}`);
    if (!before && cls === 'card back') now.backs.add(`${hid}|${i}|${j}`);
  }));
  const st = document.querySelector('.result'); if (st) mark(st, `${hid}|result|${st.textContent}`);
  return now;
}
// Plays out what just changed: new cards fly from the shoe one at a time in deal order (you, dealer, you, dealer),
// a face-down card turns over, the dealer's extra cards come out with a pause each, and only then do the totals,
// result and new balance show. The server already settled the hand; this is just how it's shown.
function choreograph(before) {
  const f = document.querySelector('.felt');
  if (!f) return rollBal(0);
  const hid = route() + '|' + f.dataset.hid, dealerRow = f.dataset.dealer === undefined ? -1 : +f.dataset.dealer;
  const fresh = []; let anyStill = false;
  f.querySelectorAll('.hand').forEach((h, i) => [...h.children].forEach((c, j) => {
    if (c.classList.contains('still')) { anyStill = true; return; }
    if (c.classList.contains('empty')) return;
    fresh.push({ c, i, j, flip: before.backs.has(`${hid}|${i}|${j}`) && !c.classList.contains('back') });
  }));
  const initial = !anyStill;
  const order = x => (x.i === dealerRow && !initial ? 1000 : 0) + x.j * 10 + (x.i === dealerRow ? 5 : x.i);
  fresh.sort((a, b) => order(a) - order(b));
  const shoe = f.querySelector('.shoe'), sr = shoe ? shoe.getBoundingClientRect() : f.getBoundingClientRect();
  let t = 0;
  fresh.forEach((x, k) => {
    if (k) t += fresh[k - 1].flip ? 380 : x.j >= 2 ? 420 : 170;
    if (REDUCED) return;
    setTimeout(x.flip ? SND.flip : SND.card, t);
    if (x.flip) { x.c.style.animationDelay = t + 'ms'; x.c.classList.add('flip'); return; }
    const e = x.c.getBoundingClientRect();
    x.c.animate([{ transform: `translate(${sr.left - e.left}px, ${sr.top - e.top}px) rotate(-12deg) scale(.8)`, opacity: .9 }, { transform: 'none', opacity: 1 }],
      { duration: 300, delay: t, easing: 'cubic-bezier(.2,.8,.25,1)', fill: 'backwards' });
  });
  const end = fresh.length && !REDUCED ? t + 380 : 0;
  // totals, tags, result and bet lines wait for the cards
  const late = [...document.querySelectorAll('#view [data-late]')];
  const show = () => { late.forEach(el => { el.classList.remove('late-hide'); if (!el.classList.contains('still')) el.classList.add(el.classList.contains('result') ? 'slide' : 'late-show'); }); resultSound(); };
  const row = document.querySelector('#view .slots');
  if (end) { late.forEach(el => el.classList.add('late-hide')); if (row) row.classList.add('hold'); setTimeout(() => { show(); if (row) row.classList.remove('hold'); }, end); } else show();
  lastEnd = end;
  rollBal(end);
}
// a new result stamp: win / lose / push sound
function resultSound() {
  const r = document.querySelector('#view .result:not(.still)'); if (!r) return;
  if (r.classList.contains('lost')) SND.lose(); else if (r.classList.contains('even')) SND.push(); else SND.win();
}
// the balance on screen rolls to the new number once the hand has played out
function rollBal(delay) {
  const el = document.getElementById('balNum');
  if (!S.me) return;
  const to = S.me.bal || 0, from = shownBal === null ? to : shownBal;
  shownBal = to;
  if (!el) return;
  if (from === to || REDUCED) { el.textContent = money(to); return; }
  el.textContent = money(from);
  setTimeout(() => {
    const t0 = performance.now(), run = now => { const k = Math.min(1, (now - t0) / 520), e = 1 - Math.pow(1 - k, 3), v = from + (to - from) * e;
      el.textContent = money(k < 1 ? Math.round(v) : to); if (k < 1) requestAnimationFrame(run); };
    requestAnimationFrame(run);
  }, delay);
}
window.addEventListener('hashchange', () => { T.err = ''; T.got = 0; spotOn = 'main'; hist = []; if (!route()) load(); else render(); window.scrollTo(0, 0); });

// ---------- lobby ----------
// "Nameplates": chip leader rows get each player's equipped overall bar as a soft wash, plus border, title and sticker (plates.js).
// Loaded once; the lobby redraws when it arrives.
let PL = null;
let COS = (() => { try { const m = (JSON.parse(localStorage.getItem('sb:me')) || {}).m; return m && m.all ? { own: m.own, all: m.all } : null; } catch (e) { return null; } })();
window.addEventListener('sb:me', e => { const m = e.detail; if (m && m.all && (!COS || COS.own !== m.own)) { COS = { own: m.own, all: m.all }; if (S && S.me && !onGame()) render(); } });
import('/plates.js').then(m => m.loadouts().then(lo => { PL = { ...lo, bits: m.bits }; if (S && !onGame()) render(); })).catch(() => {});
const onGame = () => S && S.me && ['blackjack', 'freebet', 'madness', 'uth', 'baccarat'].includes(route());
function plateOf(id) {
  const b = PL && PL.L && PL.bits(PL.L, PL.byId[id]);
  return b || { any: false, bar: '', title: '', sticker: '', face: h => h };
}
let allLeaders = false;
function board(rail) {
  const list = rail && !allLeaders ? S.board.slice(0, 5) : S.board;
  const rows = list.map((r, k) => { const b = plateOf(r.id), you = S.me && r.id === S.me.id;
    return `<tr class="${you ? 'you' : ''}${b.bar ? ' pl-wash' : ''}"><td class="rk">${b.bar ? `<span class="pl-bg ${b.bar}" aria-hidden="true"></span>` : ''}${k + 1}</td><td class="n"><span class="nw">${b.face(av(r.id, r.name), 30, true)}<span class="pl-nm"><b>${esc(r.name)}</b>${b.title}</span>${b.sticker}${you ? ' <span class="youtag">you</span>' : ''}</span></td><td class="m">${money(r.bal)}</td></tr>`; }).join('');
  const more = rail && S.board.length > 5 ? `<button class="lbmore" data-leaders>${allLeaders ? 'Top 5 only' : `All ${S.players} players →`}</button>` : '';
  return `<div class="panel lbp"><h2 class="g">Chip leaders</h2>${rail ? '' : `<p class="hint">Everyone's chips, Discord and site together.</p>`}
    ${rows ? `<table class="lb pl-t">${rows}</table>` : '<p class="hint">Nobody has chips yet.</p>'}${more}</div>`;
}
function feed() {
  const ago = t => { const m = Math.round((Date.now() - t) / 60e3); return m < 1 ? 'now' : m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };
  const unit = g => g === 'roulette' ? 'spins' : g === 'study cards' ? 'packs' : g.startsWith('duel') ? 'duels' : 'hands';

    : lastg && R[lastg][2]() >= 1 ? `<div class="resume"><div><b>${R[lastg][1]} · last table</b><small>Your ${money(R[lastg][2]())} bet${lastg === 'uth' ? ' (ante, blind, play)' : ''} is still on the felt.</small></div><div><button class="cbtn gold" data-again="${lastg}"${busy || R[lastg][2]() > (me.bal || 0) ? ' disabled' : ''}>Deal ${money(R[lastg][2]())}</button> <a class="cbtn ghost" href="#${R[lastg][0]}">Change bet</a></div></div>` : '';
  // what's open now
  const faces = list => `<span class="faces">${list.map(x => av(x.id, x.name)).join('')}</span>`;
  const pk = O.poker, lv = O.live;
  const nowc = `${gotwBanner()}<div class="nowg">${jackpot()}
    <a class="nowc" href="/poker" style="--c:var(--pink)"><span class="k">Poker room${pk ? ' <i>OPEN</i>' : ''}</span><b>${pk ? `${pk.seats.length} of ${pk.of} seated` : 'Closed'}</b>${pk && pk.seats.length ? faces(pk.seats) : ''}
      <span class="s">${pk ? `${money(pk.sb)}/${money(pk.bb)} no-limit${pk.host ? ` · hosted by ${esc(pk.host)}` : ''}` : "No-limit Hold'em with the group. Anyone in the Discord can open it, and practice vs bots is always on."}</span><span class="go">${pk ? 'Take a seat →' : 'Open or practice →'}</span></a>
    <a class="nowc" href="/live" style="--c:var(--up)"><span class="k">Live table${lv ? ' <i>OPEN</i>' : ''}</span><b>${lv ? esc(lv.game) : 'None open'}</b>${lv && lv.seats.length ? faces(lv.seats) : ''}
      <span class="s">${lv ? `${money(lv.min)} to ${money(lv.max)} · ${lv.of - lv.seats.length} seat${lv.of - lv.seats.length === 1 ? '' : 's'} open${lv.host ? ` · host ${esc(lv.host)}` : ''}` : 'Blackjack, Free Bet or UTH with the group: everyone plays at once against one dealer.'}</span><span class="go">${lv ? 'Take a seat →' : 'Open a table →'}</span></a></div>`;
  // your own table: who's been playing each game in the last 10 minutes comes from the feed
  const recent = g => [...new Set(S.feed.filter(f => f.game === g && Date.now() - f.at < 10 * 60e3).map(f => f.name))];
  const game = (route, g, ic, c, name, rule, live) => { const who = recent(g); return `<a class="grow" href="#${route}" style="--c:${c}"><span class="ic">${ic}</span><span style="min-width:0"><b>${name}${fTag(route)}</b><small>${rule}</small></span>
    <span class="stat">${live ? '<b>Hand in progress</b>yours' : who.length ? `<b>${esc(who.slice(0, 2).join(', '))}${who.length > 2 ? ` +${who.length - 2}` : ''}</b>playing now` : ''}</span><span class="cbtn gold">${live ? 'Back' : 'Play'}</span></a>`; };
  const games = `<div class="glist panel"><h2 class="g">Your own table</h2>
    ${game('blackjack', 'blackjack', '♠', 'var(--gold)', 'Blackjack', `$1 to $${S.maxBet} · pays 3:2, split up to 6 hands`, T.bj && !T.bj.over)}
    ${game('freebet', 'free bet', '♦', 'var(--up)', 'Free Bet Blackjack', 'Free doubles on 9 to 11, free splits, dealer 22 pushes · Push 22 12:1 · Pot of Gold up to 1,000:1', T.fb && !T.fb.over)}
    ${game('madness', 'madness', '2×', 'var(--mad)', 'Double Down Madness', 'Start with one card, double as often as you like, dealer 22 pushes · War and Match side bets', T.mad && !T.mad.over)}
    ${game('uth', 'UTH', '♣', 'var(--pink)', "Ultimate Hold'em", `Ante $1 to $${S.maxAnte} + blind vs the dealer · Trips up to 50:1`, T.uth && T.uth.stage !== 'done')}
    ${game('baccarat', 'baccarat', '♥', 'var(--vio)', 'Baccarat', `Player, Banker or Tie · $1 to $${S.maxBet}`, false)}
    ${game('roulette', 'roulette', '◉', 'var(--sky, #7fb6ff)', 'Roulette', 'One table with Discord #casino · 30 second rounds · number pays 35:1', false)}</div>`;
  // the full lottery panel (wheel, how it works) opens from the tickets line; it opens by itself when a new draw happened
  const fresh = L && L.last && L.last.quarter !== L.quarter && Date.now() - L.last.at < 14 * 864e5 && L.lastBoard && !pref('lotSeen:' + L.last.quarter, false);
  const lot = L ? `<div id="lotbox"${pref('lotOpen', false) || fresh ? '' : ' hidden'}>${lottery()}</div>` : '';
  return `${msg}${T.err ? `<div class="err">${esc(T.err)}</div>` : ''}<div class="club-g"><div class="rail">${club}${vsCard()}${board(true)}${rewards()}</div>
    <div class="club-m">${resume}${nowc}${games}${lot}${feed()}</div></div>`;
}

// ---------- shared table bits ----------
const balBar = (title, net) => (title === 'Roulette' ? '' : gotwLine()) + `<div class="tablebar"><a class="cbtn vio" href="#">← Lobby</a><span class="bal">Chips<b id="balNum">${money(shownBal === null ? S.me.bal || 0 : shownBal)}</b>${net ? `<i data-late class="${net > 0 ? 'pos' : 'neg'}">${signed(net)}</i>` : ''}${K.sndButton()}</span></div>`;
const felt = (hid, inner, extra = '') => `<div class="felt${extra}" data-hid="${hid}"${extra.includes('bac') ? '' : ' data-dealer="0"'}><div class="shoe" aria-hidden="true"></div>${inner}<div class="wait${busy ? ' on' : ''}"></div></div>`;
const betChip = amt => `<div class="betchip">${K.chips(amt)}<span class="tk-amt">${money(amt)}</span></div>`;
const resultStamp = net => `<div data-late class="result${net < 0 ? ' lost' : net === 0 ? ' even' : ''}">${net > 0 ? 'You win' : net < 0 ? 'You lose' : 'Push'}<small>${net ? signed(net) : 'bet back'}</small></div>`;
// chip rack: pending bets live in prefs (bet stays the same for the next hand); spotOn = which spot on the felt takes chips
let spotOn = 'main', hist = [], bumped = '', again = ''; // again = a deal to fire once the table opens (the lobby's Deal again)
const DEF = { bj: 20, fb: 20, mad: 20, ante: 10, bac: 20, p22: 0, pog: 0, war: 0, match: 0, trips: 0 }, pv = k => +pref(k, DEF[k]) || 0; // pending bet on a spot
const pendMax = k => LIMIT[k][1]();
function spotsHTML(list) { // [role, key, name, sub, cls]
  const out = list.map(([role, key, name, sub, cls]) => { const amt = pv(key), on = list.length > 1 && spotOn === role;
    return `<button class="bspot ${cls || ''}${on ? ' on' : ''}${bumped === role ? ' bump' : ''}" data-spot="${role}" aria-label="${esc(name)}${amt ? ' ' + money(amt) : ''}">${amt ? `${K.chips(amt)}<span class="tk-amt">${money(amt)}</span>` : `${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ''}`}</button>`; }).join('');
  bumped = '';
  return `<div class="bspots">${out}</div>`;
}
// sideKey = one side bet key, or a list of them (spots 'side', 'side2')
function rackHTML(mainKey, sideKey, dealAttr, dealLabel, ok, hint) {
  const sides = [].concat(sideKey || []), key = (spotOn === 'side' && sides[0]) || (spotOn === 'side2' && sides[1]) || mainKey, cur = pv(key), cap = pendMax(key);
  const chips = [1, 5, 25, 100, 500].map(v => `<button class="chip c${v}" data-chip="${v}"${cur >= cap ? ' disabled' : ''} aria-label="Add ${money(v)}"><span>$${v}</span></button>`).join('');
  const any = pv(mainKey) + sides.reduce((a, k) => a + pv(k), 0);
  return `<div class="rackb"><div class="rack">${chips}</div>
    <div class="tools">${btn('data-rk="undo"', 'Undo', 'ghost', hist.length > 0)}${btn('data-rk="clear"', 'Clear', 'ghost', any > 0)}${btn('data-rk="x2"', '2x', 'ghost', pv(mainKey) > 0 && pv(mainKey) < pendMax(mainKey))}</div>
    ${btn(dealAttr, dealLabel, 'gold deal', ok && !busy)}</div><p class="rhint">${hint}</p>`;
}
const btn = (attr, label, cls, ok = true) => `<button class="cbtn ${cls}${pressed === attr ? ' pressed' : ''}" ${attr}${ok ? '' : ' disabled'}>${label}</button>`;
const syncLine = '<div class="sync">🔗 Uses your Discord chips. Your balance and /chips on Discord update straight away.</div>';

// ---------- blackjack: mode 'bj' (#blackjack), 'fb' (Free Bet, #freebet, mode 'free'), 'mad' (Double Down Madness, #madness, mode 'mad'); same game code ----------
const POG_TXT = '1 free bet 3:1 · 2 12:1 · 3 30:1 · 4 60:1 · 5 100:1 · 6 300:1 · 7+ 1,000:1';
function blackjack(mode) {
  const fm = mode === 'fb', mm = mode === 'mad', g = T[mode], bk = mode, bet = pref(bk, 20) || 0, live = g && !g.over;
  const sideKeys = fm ? ['p22', 'pog'] : mm ? ['war', 'match'] : [], sideAmt = sideKeys.reduce((a, k) => a + (pref(k, 0) || 0), 0);
  if (!sideKeys.length) spotOn = 'main';
  const spots = live ? '' : spotsHTML([['main', bk, 'Bet', `$1 to $${S.maxBet}`],
    ...(fm ? [['side', 'p22', 'Push 22', 'pays 12:1', 'sm'], ['side2', 'pog', 'Pot of Gold', 'up to 1,000:1', 'sm']] : []),
    ...(mm ? [['side', 'war', 'War', 'pays 1:1', 'sm'], ['side2', 'match', 'Match', 'up to 12:1', 'sm']] : [])]);
  let inner = '<div class="lbl">Dealer</div><div class="hand">' + card('__') + card('__') + '</div><div class="lbl">' + esc(S.me.name) + '</div><div class="hand">' + card('__') + (mm ? '' : card('__')) + '</div>';
  if (g) {
    const many = g.hands.length > 2;
    const dTxt = g.over ? (g.d22 ? '22 · pushes' : g.dealerTotal > 21 ? `${g.dealerTotal} · bust` : g.dealerTotal) : `${g.dealerTotal} + ?`;
    const x = h => mm ? Math.round(h.bet / g.bet) : 1;
    const stake = h => [h.bet ? money(h.bet) : '', h.free ? `<span class="ftag">FREE ${money(h.free)}</span>` : '', x(h) > 1 ? `<span class="ftag dd">${x(h)}x</span>` : ''].filter(Boolean).join(' ');
    const name = k => g.hands.length === 1 ? esc(S.me.name) : many ? `Hand ${k + 1}` : `${esc(S.me.name)} · hand ${k + 1}`;
    const tagOf = (res, txt) => `<span data-late class="tag ${res}">${txt}</span>`;
    const sd = g.sides || {};
    inner = `<div class="lbl">Dealer <span class="tot" data-late>${dTxt}</span></div><div class="hand">${g.dealer.map(card).join('')}</div><div class="hands${many ? ' many' : ''}">` +
      g.hands.map((h, k) => `<div><div class="lbl${live && g.active === k && g.hands.length > 1 ? ' on' : ''}">${name(k)} · ${stake(h)}${h.freeDbl ? ' (free double)' : h.doubled && !mm ? ' (doubled)' : ''}
        <span class="tot" data-late>${h.soft && h.total < 21 && live && g.active === k ? `${h.total - 10} / ${h.total}` : h.total}</span>${h.res ? tagOf(h.res, { win: 'WIN', bj: 'BLACKJACK', push: g.d22 ? 'DEALER 22 · PUSH' : 'PUSH', lose: 'LOSE', bust: 'BUST' }[h.res]) : ''}</div>
        <div class="hand">${h.cards.map(card).join('')}${mm && live && h.cards.length === 1 ? card('__') : ''}</div></div>`).join('') + '</div>';
    const sl = [];
    if (g.side) sl.push(`<span class="sb">Push 22 ${money(g.side)}${g.over ? tagOf(g.sideWin ? 'win' : 'lose', g.sideWin ? 'WIN 12:1' : 'LOSE') : ''}</span>`);
    if (g.pog) { const n = Math.min(g.fb, 7), odds = [0, 3, 12, 30, 60, 100, 300, 1000][n];
      sl.push(`<span class="sb">Pot of Gold ${money(g.pog)} · ${g.fb} free bet${g.fb === 1 ? '' : 's'}${g.over ? tagOf(g.pogWin ? 'win' : 'lose', g.pogWin ? `WIN ${odds.toLocaleString()}:1` : 'LOSE') : ''}</span>`); }
    if (g.war && sd.war) sl.push(`<span class="sb">War ${money(g.war)}${tagOf(sd.war.res === 'tie' ? 'push' : sd.war.res, sd.war.res === 'win' ? 'WIN 1:1' : sd.war.res === 'tie' ? 'TIE · HALF BACK' : 'LOSE')}</span>`);
    if (g.match && sd.match) sl.push(`<span class="sb">Match ${money(g.match)}${tagOf(sd.match.res, sd.match.res === 'win' ? `${sd.match.kind.toUpperCase()} ${sd.match.x}:1` : 'LOSE')}</span>`);
    if (sl.length) inner += `<div class="lbl sides2">${sl.join('')}</div>`;
    inner += (live ? betChip(g.hands.reduce((a, h) => a + h.bet, 0) + (g.side || 0) + (g.pog || 0)) : '') + (g.over ? resultStamp(g.net) : '');
  }
  inner += spots;
  const need = bet + sideAmt, spotName = { main: 'Bet', side: fm ? 'Push 22' : 'War', side2: fm ? 'Pot of Gold' : 'Match' };
  const hint = bet < 1 ? 'Tap chips to place your bet.' : sideKeys.length ? `Chips go on ${spotName[spotOn] || 'Bet'}. Tap another spot on the table to bet there.` : 'Your bet stays on the table for the next hand.';
  // the same buttons in the same places every time; the bet chips stay put underneath. Free doubles and splits turn green.
  // Double Down Madness: Hit, Stand (from your second card on) and Double, which adds your whole bet again, as often as you like
  const one = mm && g && g.hands[0].cards.length === 1, h0 = g && g.hands[0];
  const madHint = !live || !mm ? '' : `<p class="rhint">${one ? (h0.cards[0][0] === 'A' ? 'You started with an ace: your next card is your last. Hit, or double first.' : 'One card each. Hit or double for your second card.')
    : `Double any time: it adds your whole bet again (${money(h0.bet)} → ${money(h0.bet * 2)}) and gives you one more card. You can keep going.`}</p>`;
  const controls = `<div class="ctlbox">${live && mm ? `<div class="slots" style="--n:3">${btn('data-bj="hit"', 'Hit', 'gold')}${btn('data-bj="stand"', 'Stand', '', g.canStand)}${btn('data-bj="double"', `Double +${money(g.dblCost)}`, 'free tight', g.canDouble)}</div>${madHint}`
    : live ? `<div class="slots">${btn('data-bj="hit"', 'Hit', 'gold')}${btn('data-bj="stand"', 'Stand', '')}${btn('data-bj="double"', g.freeDouble ? 'Free double' : 'Double', g.freeDouble ? 'free' : 'ghost', g.canDouble)}${btn('data-bj="split"', g.freeSplit ? 'Free split' : 'Split', g.freeSplit ? 'free' : 'ghost', g.canSplit)}</div>`
    : rackHTML(bk, sideKeys.length ? sideKeys : null, `data-do="${bk}-deal"`, `Deal ${money(need)}`, bet >= 1 && need <= (S.me.bal || 0), hint)}</div>`;
  const max = S.maxSide || 25;
  const rules = fm
    ? `Free double on a hard 9, 10 or 11 · free split on any pair except 10s (up to 6 hands) · a free bet pays even money when its hand wins and costs nothing when it loses · dealer hits soft 17 · dealer 22 pushes every standing hand · blackjack pays 3:2 · six decks, shuffled every hand · $1 to $${S.maxBet}. Push 22 ($0 to $${S.maxPush22 || 25}) pays 12:1. Pot of Gold ($0 to $${max}) pays for every free double and free split you get that hand, win or lose: ${POG_TXT} (loses to a dealer blackjack). Same as /freebet.`
    : mm ? `You start with one card, the dealer with two (the dealer checks for blackjack with an ace or 10 showing) · hit or double for your second card and every card after: doubling adds your whole bet again ($20 → $40 → $80), as many times as you like · no splits · start with an ace and you get one more card only · suited blackjack pays 2:1, other blackjacks 3:2 (on the whole bet) · dealer hits soft 17 · dealer 22 pushes every hand still standing · six decks, shuffled every hand · $1 to $${S.maxBet}. War ($0 to $${max}): your first card beats the dealer's up card (ace high), 1:1, a tie gives back half. Match ($0 to $${max}): your first card vs the dealer's up card, suited pair 12:1, pair 4:1, same suit 1:1. Same as /madness.`
    : `Blackjack pays 3:2 · dealer stands on all 17s · double on any first two cards · split up to 6 hands (split aces get one card each) · $1 to $${S.maxBet}. Same as /blackjack.`;
  return `${balBar(fm ? 'Free Bet' : mm ? 'Double Down Madness' : 'Blackjack', g && g.over ? g.net : 0)}${felt(g ? g.id : '', inner)}${controls}<div class="err">${esc(T.err)}</div>
    <p class="rules">${rules}</p>${syncLine}`;
}

// ---------- Ultimate Hold'em ----------
function uth() {
  const g = T.uth, ante = pref('ante', 10) || 0, trips = pref('trips', 0) || 0, done = g && g.stage === 'done';
  const spots = g && !done ? '' : spotsHTML([['side', 'trips', 'Trips', 'up to 50:1', 'sm'], ['main', 'ante', 'Ante', `$1 to $${S.maxAnte}`]]);
  let inner;
  if (!g) inner = `<div class="lbl">Dealer</div><div class="hand">${card('__')}${card('__')}</div><div class="lbl">Board</div><div class="hand uth-board">${Array(5).fill(card('__')).join('')}</div><div class="lbl">${esc(S.me.name)}</div><div class="hand">${card('__')}${card('__')}</div>${spots}`;
  else inner = `<div class="lbl">Dealer ${done ? `<span class="tot" data-late>${esc(g.dlHand)}${g.qualifies ? ' · qualifies' : " · doesn't qualify"}</span>` : ''}</div><div class="hand">${g.dealer.map(card).join('')}</div>
      <div class="lbl">Board</div><div class="hand uth-board">${g.board.map(c => c === 'XX' ? card('__') : card(c)).join('')}</div>
      <div class="lbl">${esc(S.me.name)} <span class="tot" data-late>${esc(g.myHand)}</span>${done ? `<span data-late class="tag ${g.res}">${g.res.toUpperCase()}</span>` : ''}</div><div class="hand">${g.me.map(card).join('')}</div>
      ${done ? spots : betChip(g.onTable)}${done ? resultStamp(g.net) : ''}`;
  // two buttons that never move: the bet (or Deal) and check/fold, right under the table; results and chips go below them
  const live = g && !done, st = live ? g.stage : '', a = live ? g.ante : ante;
  const b = (m, cls) => btn(`data-uth="b${m}"`, `Bet ${m}x ${money(a * m)}`, cls, live && g.afford[m]);
  // check / fold on the left, the bet on the right, like /live and the poker room
  const need = ante * 3 + trips, hint = ante < 1 ? 'Tap chips to place your ante.' : `Chips go on ${spotOn === 'side' ? 'Trips' : 'Ante'}. Tap ${spotOn === 'side' ? 'Ante' : 'Trips'} on the table to bet there.`;
  const slots = `<div class="ctlbox">${live ? `<div class="slots" style="--n:2">${st === 'river' ? btn('data-uth="fold"', 'Fold', 'ghost') : btn('data-uth="chk"', 'Check', 'ghost')}${st === 'pre' ? b(4, 'gold') : st === 'flop' ? b(2, 'gold') : b(1, 'gold')}</div>`
    : rackHTML('ante', 'trips', 'data-do="uth-deal"', `Deal ${money(need)}`, ante >= 1 && need <= (S.me.bal || 0), hint)}</div>`;
  const controls = `<p class="rules stage">${!live ? `Ante + equal blind up front${trips ? ', plus trips' : ''}, and 1x your ante held so the river bet is always covered (back if you fold). Then bet 4x before the flop, 2x on the flop, or 1x on the river.`
      : st === 'pre' ? 'Pre-flop: bet 4x your ante now, or check and decide after the flop.' : st === 'flop' ? 'Flop: bet 2x your ante, or check.' : 'River: bet 1x your ante, or fold and lose the ante and blind.'}
      ${live ? `Ante ${money(g.ante)} · Blind ${money(g.ante)}${g.trips ? ` · Trips ${money(g.trips)}` : ''}${g.held ? ` · ${money(g.held)} held for the river bet` : ''}` : ''}</p>`;
  const lines = done ? `<div class="lines" data-late>${g.lines.map(([b, why, amt]) => `<div><b>${esc(b)}</b><span>${esc(why)}</span><span class="${amt > 0 ? 'pos' : amt < 0 ? 'neg' : ''}">${amt ? signed(amt) : '$0'}</span></div>`).join('')}</div>` : '';
  return `${balBar("Ultimate Hold'em", done ? g.net : 0)}${felt(g ? g.id : '', inner)}${slots}<div class="err">${esc(T.err)}</div>${lines}${controls}
    <details class="pay"><summary>Payouts</summary>${esc(S.uthPaytable)}</details>${syncLine}`;
}

// ---------- baccarat ----------
function baccarat() {
  const r = T.bac, bet = pref('bac', 20) || 0, side = pref('side', 'banker');
  // one bet: tap Player, Tie or Banker on the table to move your chips there
  const bspots = `<div class="bspots">${['player', 'tie', 'banker'].map(k => { const [n, p] = { player: ['Player', 'pays 1:1'], tie: ['Tie', 'pays 8:1'], banker: ['Banker', 'pays 0.95:1'] }[k], on = side === k;
    return `<button class="bspot rect${on ? ' on' : ''}${on && bumped === 'main' ? ' bump' : ''}" data-spot="bac-${k}" aria-label="${n}">${on && bet ? `${K.chips(bet)}<span class="tk-amt">${money(bet)}</span>` : `${n}<small>${p}</small>`}</button>`; }).join('')}</div>`;
  bumped = ''; spotOn = 'main';
  const SIDES = { player: ['Player', 'pays 1:1', 'var(--vio)'], banker: ['Banker', 'pays 0.95:1', 'var(--gold)'], tie: ['Tie', 'pays 8:1', 'var(--up)'] };
  let inner = `<div class="bacrow"><div><div class="lbl">Player</div><div class="hand">${card('__')}${card('__')}</div></div><div><div class="lbl">Banker</div><div class="hand">${card('__')}${card('__')}</div></div></div>`;
  if (r) {
    const c = r.coup, w = c.winner;
    inner = `<div class="bacrow"><div><div class="lbl">Player <span class="tot" data-late>${c.ps}</span>${w === 'player' ? '<span data-late class="tag win">WINS</span>' : ''}</div><div class="hand">${c.p.map(card).join('')}</div></div>
      <div><div class="lbl">Banker <span class="tot" data-late>${c.bs}</span>${w === 'banker' ? '<span data-late class="tag win">WINS</span>' : ''}</div><div class="hand">${c.b.map(card).join('')}</div></div></div>
      <div class="lbl sum" data-late style="margin-top:6px">${w === 'tie' ? `Tie ${c.ps}–${c.bs}` : `${SIDES[w][0]} wins ${Math.max(c.ps, c.bs)}–${Math.min(c.ps, c.bs)}`}${c.natural ? ' · natural' : ''} · you bet ${money(r.bet)} on ${SIDES[r.side][0]}</div>
      ${resultStamp(r.net)}`;
  }
  inner += bspots;
  return `${balBar('Baccarat', r ? r.net : 0)}${felt(r ? r.n : '', inner, ' bac')}
    <div class="ctlbox">${rackHTML('bac', null, 'data-do="bac-deal"', `Deal ${money(bet)}`, bet >= 1 && bet <= (S.me.bal || 0), bet < 1 ? 'Tap chips to place your bet.' : `Your bet is on ${SIDES[side][0]}. Tap Player, Tie or Banker on the table to move it.`)}</div><div class="err">${esc(T.err)}</div>
    <p class="rules">Fresh 6-deck shoe each hand, standard third-card rules. Player and Banker bets push on a tie. Same as /baccarat.</p>${syncLine}`;
}

// ---------- buttons ----------
const LIMIT = { bj: [1, () => S.maxBet], fb: [1, () => S.maxBet], mad: [1, () => S.maxBet], p22: [0, () => S.maxPush22 || 25], pog: [0, () => S.maxSide || 25], war: [0, () => S.maxSide || 25], match: [0, () => S.maxSide || 25], bac: [1, () => S.maxBet], ante: [1, () => S.maxAnte], trips: [0, () => S.maxTrips] };

      <small>${r.hands} hand${r.hands === 1 ? '' : 's'}${ok ? '' : ` · needs ${f.minHands}`}</small><span class="m ${r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : ''}">${signed(r.net)}</span></div>`; }).join('');
  const me = f.me, mine = me ? (me.hands >= f.minHands ? `You: ${me.rank ? '#' + me.rank + ' · ' : ''}${me.hands} hands · ${signed(me.net)}` : `You: ${me.hands} of ${f.minHands} hands to qualify`) : '';
  return `<section class="gotw" style="--gc:${f.css}" aria-label="Game of the Week"><div class="in"><div>

        <div class="perk"><span class="k">${Math.round(f.cut * 100)}%</span><div>of every losing bet goes to the jackpot<small>Twice the usual 2%, so the pot fills faster while people play it</small></div></div>
        <div class="perk"><span class="k">2x</span><div>odds to be the hand that drops the jackpot<small>Your hand puts twice as much in, so it covers twice as much of the pot</small></div></div>

    <div><div class="rh">HEADLINER RACE</div>${rows || `<div class="empty">Nobody has played ${esc(f.short)} yet this week. First ${f.minHands} hands put you on the board.</div>`}
      ${mine ? `<div class="hint" style="margin:8px 0 0">${mine}</div>` : ''}</div></div></section>`;
}
const gotwLine = () => { const f = F(); if (!f || f.route !== route()) return '';
  const me = f.me; return `<div class="gotwl" style="--gc:${f.css}">⭐ <b>Game of the Week.</b> Losing hands here put ${Math.round(f.cut * 100)}% in the jackpot (twice as likely to drop it).${me ? ` Headliner race: ${me.hands >= f.minHands ? `${me.rank ? '#' + me.rank + ', ' : ''}${signed(me.net)}` : `${me.hands} of ${f.minHands} hands`}.` : ''}</div>`; };

// ---------- roulette: the shared #casino table (api/_roulette.js) ----------
// The table lives on the server; this page watches it (GET /api/casino?ro=1 every few seconds while it's on screen)
// and bets with one tap per chip. Discord players tap the same table in #casino.
const WHEEL = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
const REDN = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
const ncol = n => n === 0 ? 'green' : REDN.has(n) ? 'red' : 'black';
const WHEEL_BG = (() => { const seg = 360 / 37; return 'conic-gradient(from ' + (-seg / 2) + 'deg, ' + WHEEL.map((n, i) => `${ncol(n) === 'red' ? '#c2283e' : ncol(n) === 'black' ? '#1e1f22' : '#248046'} ${i * seg}deg ${(i + 1) * seg}deg`).join(', ') + ')'; })();
const OUT = { red: 'Red', black: 'Black', odd: 'Odd', even: 'Even', low: '1–18', high: '19–36', d1: '1st 12', d2: '2nd 12', d3: '3rd 12' };
const RL = { ch: '', t: null, skew: 0, chip: [1, 5, 25, 100, 500].includes(pref('rochip', 5)) ? pref('rochip', 5) : 5, err: '', busy: false, loaded: false, shown: '', rot: 0, spinning: '', timer: null, tick: null };
const rlNow = () => Date.now() + RL.skew;
const rlKey = (type, num) => type === 'num' ? 'n' + num : type;
const rlWins = (type, num, n) => type === 'num' ? num === n : type === 'red' ? ncol(n) === 'red' : type === 'black' ? ncol(n) === 'black' : n === 0 ? false
  : type === 'odd' ? n % 2 === 1 : type === 'even' ? n % 2 === 0 : type === 'low' ? n <= 18 : type === 'high' ? n >= 19 : type === 'd1' ? n <= 12 : type === 'd2' ? n >= 13 && n <= 24 : n >= 25;
function rlTake(j) {
  if (!j) return;
  if (j.ch) RL.ch = j.ch;
  if (j.now) RL.skew = j.now - Date.now();
  if (j.t !== undefined) RL.t = j.t;
  if (j.max) RL.max = j.max;
  if (typeof j.bal === 'number' && S.me && !RL.spinning) setBal(j.bal);
  jpTake(j.jp, false);
  RL.loaded = true;
}
async function rlPoll() {
  clearTimeout(RL.timer);
  if (route() !== 'roulette' || !S || !S.me) return;
  if (!document.hidden) {
    try { const j = await (await fetch('/api/casino?ro=1' + (RL.ch ? '&ch=' + encodeURIComponent(RL.ch) : ''), { cache: 'no-store', credentials: 'same-origin' })).json(); if (!j.err) { rlTake(j); if (!RL.spinning) render(); } } catch (e) {}
  }
  const t = RL.t, open = t && !t.spun;
  RL.timer = setTimeout(rlPoll, open ? (t.ends - rlNow() < 4000 ? 1200 : 2500) : 9000);
}
async function rlPost(body) {
  if (RL.busy) return; RL.busy = true; RL.err = '';
  try {
    const r = await fetch('/api/casino', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' });
    const j = await r.json().catch(() => ({ err: 'Something went wrong. Try again.' }));
    if (j.signedOut) { S.me = null; } else if (j.err) { RL.err = j.err; rlTake(j); } else if (!j.busy) rlTake(j);
  } catch (e) { RL.err = "Couldn't reach the table. Check your connection."; }
  finally { RL.busy = false; render(); rlPoll(); }
}
function rlBoard(t, open) {
  const mine = {}, all = {}, won = t && t.spun ? t.result : null;
  if (t) t.bets.forEach(b => { const k = rlKey(b.type, b.num); all[k] = (all[k] || 0) + b.amt; if (b.uid === S.me.id) mine[k] = (mine[k] || 0) + b.amt; });
  const tag = k => (mine[k] ? `<span class="bt">${money(mine[k]).replace('.00', '')}</span>` : '') + (all[k] && all[k] !== mine[k] ? `<span class="bt o">${money(all[k] - (mine[k] || 0)).replace('.00', '')}</span>` : '');
  const cell = (type, num, label, r, c, pr, pc, cls) => { const k = rlKey(type, num), w = won !== null && rlWins(type, num, won);
    return `<button class="${cls || ''}${w ? ' won' : ''}" style="--r:${r};--c:${c};--pr:${pr};--pc:${pc}" data-rl="${type}" data-num="${num ?? ''}"${open && !RL.busy ? '' : ' disabled'} aria-label="${esc(label)}${mine[k] ? ', yours ' + money(mine[k]) : ''}">${label}${tag(k)}</button>`; };
  let h = cell('num', 0, '0', '1 / 4', 1, 1, '1 / 4', 'n-green');
  for (let n = 1; n <= 36; n++) h += cell('num', n, String(n), 3 - ((n - 1) % 3), 1 + Math.ceil(n / 3), 1 + Math.ceil(n / 3), ((n - 1) % 3) + 1, 'n-' + ncol(n));
  h += cell('d1', null, '1st 12', 4, '2 / 6', 14, 1) + cell('d2', null, '2nd 12', 4, '6 / 10', 14, 2) + cell('d3', null, '3rd 12', 4, '10 / 14', 14, 3);
  h += cell('low', null, '1–18', 5, '2 / 4', 15, 1) + cell('even', null, 'Even', 5, '4 / 6', 15, 2) + cell('red', null, 'Red', 5, '6 / 8', 15, 3, 'n-red')
    + cell('black', null, 'Black', 5, '8 / 10', 16, 1, 'n-black') + cell('odd', null, 'Odd', 5, '10 / 12', 16, 2) + cell('high', null, '19–36', 5, '12 / 14', 16, 3);
  return `<div class="rl-board">${h}</div>`;
}
function rlPlayers(t) {
  if (!t || !t.bets.length) return '';
  const by = new Map();
  t.bets.forEach(b => { if (!by.has(b.uid)) by.set(b.uid, { name: b.name, site: false, amt: 0, labels: new Map() }); const p = by.get(b.uid); p.amt += b.amt; if (b.site) p.site = true; p.labels.set(b.label, (p.labels.get(b.label) || 0) + b.amt); });
  const showNet = t.spun && RL.spinning !== t.id;
  const rows = [...by.entries()].map(([uid, p]) => { const net = showNet && t.nets ? t.nets[uid] || 0 : null;
    return [net ?? p.amt, `<div class="row">${av(uid, p.name)}<span class="w"><b>${esc(p.name)}<span class="src${p.site ? '' : ' dc'}">${p.site ? 'SITE' : 'DISCORD'}</span></b><small>${[...p.labels].map(([l, a]) => `${esc(l)} ${money(a)}`).join(' · ')}</small></span>
      <span class="m ${net > 0 ? 'pos' : net < 0 ? 'neg' : ''}">${net === null ? money(p.amt) : signed(net)}</span></div>`]; }).sort((a, b) => b[0] - a[0]).map(r => r[1]).join('');
  return `<div class="panel rl-who"><h2>${t.spun ? 'This spin' : 'At the table'}</h2>${rows}</div>`;
}
function roulette() {
  const t = RL.t, open = t && !t.spun && t.ends > rlNow(), spinning = t && t.spun && RL.spinning === t.id;
  const myBets = t ? t.bets.filter(b => b.uid === S.me.id) : [], myAmt = myBets.reduce((a, b) => a + b.amt, 0), myNet = t && t.spun && t.nets ? t.nets[S.me.id] : undefined;
  const res = t && t.spun && !spinning;
  let info;
  if (!RL.loaded) info = `<div class="rl-info"><div class="res">Finding the table…</div></div>`;
  else if (open) info = `<div class="rl-info"><div class="clock"><small>SPINS IN</small><span id="rlClock">${Math.max(0, Math.ceil((t.ends - rlNow()) / 1000))}s</span></div>
      <div class="sub">Tap a chip, then tap the table. Every tap is one bet.${t.by ? ` Opened on the site by ${esc(t.by)}.` : ''} Discord players are betting on this same spin in #casino.</div></div>`;
  else if (t && !t.spun) info = `<div class="rl-info"><div class="res">No more bets</div><div class="sub">The wheel is spinning…</div></div>`;
  else if (spinning) info = `<div class="rl-info"><div class="res">No more bets</div><div class="sub">The wheel is spinning…</div></div>`;
  else info = `<div class="rl-info">${res ? `<div class="res">${t.result} ${t.color.toUpperCase()}</div><div class="sub">${myNet !== undefined ? (myNet > 0 ? `You won ${money(myNet)}.` : myNet < 0 ? `You lost ${money(-myNet)}.` : 'You broke even.') : 'Last spin.'}</div>` : '<div class="res">No table open</div>'}
      <div class="rl-open"><button class="cbtn gold big" data-rlopen${RL.busy ? ' disabled' : ''}>Open a table (30s)</button><div class="sub">It shows up in #casino too, so anyone there can bet on it.</div></div></div>`;
  const hist = t && t.hist && t.hist.length && !spinning ? `<div class="rl-hist">${t.hist.map(n => `<span class="c-${ncol(n)}">${n}</span>`).join('')}</div>` : '';
  const hubN = res ? `<div class="hub ${t.color}">${t.result}</div>` : '<div class="hub">🎡</div>';
  const wheel = `<div class="wheel"><div class="ptr"></div><div class="disc" id="rlDisc" style="--wheel:${WHEEL_BG};transform:rotate(${RL.pending ? RL.from : RL.rot}deg)"></div>${hubN}</div>`;
  const chips = [1, 5, 25, 100, 500].map(v => `<button class="chip c${v}" data-rlchip="${v}" aria-pressed="${RL.chip === v}" aria-label="Chip ${money(v)}"><span>$${v}</span></button>`).join('');
  return `${balBar('Roulette', res && myNet ? myNet : 0)}${gotwLine()}${RL.err ? `<div class="err">${esc(RL.err)}</div>` : ''}
    <div class="felt" data-hid="ro"><div class="rl-top">${wheel}<div>${info}${hist}</div></div>${rlBoard(t, open)}</div>
    <div class="rl-rack"><span class="lab">CHIP</span>${chips}<span class="tot">${open ? `On this spin<b>${money(myAmt)}</b>` : `Up to ${money(RL.max || 1000)} a spin`}</span></div>
    ${rlPlayers(t)}${syncLine}`;
}
// spin the drawn wheel to the result once per spin, then show the result
function rlAfterRender() {
  clearInterval(RL.tick);
  if (route() !== 'roulette') return;
  const t = RL.t;
  if (t && !t.spun && t.ends > rlNow()) RL.tick = setInterval(() => { const el = $('#rlClock'); if (!el) return clearInterval(RL.tick); const s = Math.max(0, Math.ceil((t.ends - rlNow()) / 1000)); el.textContent = s + 's'; if (s <= 0) { clearInterval(RL.tick); render(); } }, 250);
  if (t && t.spun && RL.shown !== t.id) {
    RL.shown = t.id;
    const fresh = Date.now() - (t.ends - RL.skew) < 25000; // only animate spins that just happened
    const idx = WHEEL.indexOf(t.result), seg = 360 / 37;
    const target = 360 * (fresh && !REDUCED ? 5 : 0) + (360 - idx * seg);
    RL.from = RL.rot; RL.rot = Math.ceil(RL.rot / 360) * 360 + target;
    if (!fresh || REDUCED) { const d = $('#rlDisc'); if (d) { d.style.transition = 'none'; d.style.transform = `rotate(${RL.rot}deg)`; } return; }
    RL.spinning = t.id; RL.pending = true; render();
    requestAnimationFrame(() => requestAnimationFrame(() => { RL.pending = false; const d = $('#rlDisc'); if (d) d.style.transform = `rotate(${RL.rot}deg)`; }));
    setTimeout(() => { RL.spinning = ''; const net = t.nets && t.nets[S.me.id]; if (net > 0) SND.win(); else if (net < 0) SND.lose(); render(); rlPoll(); }, 4300);
  }
}

function wire() {
  document.querySelectorAll('[data-bj],[data-uth],[data-do]').forEach(b => b.addEventListener('pointerdown', () => { b.classList.add('pressed'); }));
  document.querySelectorAll('details.earn').forEach(d => d.ontoggle = () => setPref('earn', d.open));
  document.querySelectorAll('[data-leaders]').forEach(b => b.onclick = () => { allLeaders = !allLeaders; render(); });
  document.querySelectorAll('[data-lot]').forEach(b => b.onclick = () => { const box = $('#lotbox'); if (!box) return; box.hidden = !box.hidden; setPref('lotOpen', !box.hidden); if (!box.hidden) box.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); });
  document.querySelectorAll('[data-again]').forEach(b => b.onclick = () => { const g = b.dataset.again; again = g + '-deal'; location.hash = '#' + { bj: 'blackjack', fb: 'freebet', mad: 'madness', uth: 'uth', bac: 'baccarat' }[g]; });
  if (again) { const d = again; again = ''; const btn = document.querySelector(`[data-do="${d}"]`); if (btn && !btn.disabled) setTimeout(() => btn.click(), 0); }
  document.querySelectorAll('[data-tksnd]').forEach(b => b.onclick = () => { if (K.toggleSound()) setTimeout(() => SND.chips(), 30); render(); });
  // the lottery wheel spins to the winning ticket once per person per draw
  document.querySelectorAll('.won g[data-spin]').forEach(g => {
    const t = document.querySelector('[data-late-won]'), q = S.lottery && S.lottery.last && S.lottery.last.quarter;
    if (!q || pref('lotSeen:' + q, false)) return;
    setPref('lotSeen:' + q, true);

    setTimeout(() => { if (t) t.style.opacity = 1; }, 5600);
  });

  const rt = route(), RK = { blackjack: ['bj'], freebet: ['fb', 'p22', 'pog'], madness: ['mad', 'war', 'match'], uth: ['ante', 'trips'], baccarat: ['bac'] }[rt];
  const snap = () => RK ? RK.map(k => pv(k)) : [], restore = v => RK.forEach((k, i) => setPref(k, v[i]));

    const k = spotOn === 'side' && RK[1] ? RK[1] : spotOn === 'side2' && RK[2] ? RK[2] : RK[0];
    hist.push(snap()); if (hist.length > 50) hist.shift();
    setPref(k, Math.min(pendMax(k), pv(k) + +b.dataset.chip)); bumped = spotOn; SND.chips(0, 1); render(); });
  document.querySelectorAll('[data-rk]').forEach(b => b.onclick = () => {
    const d = b.dataset.rk;
    if (d === 'undo' && hist.length) restore(hist.pop());
    if (d === 'clear') { hist.push(snap()); RK.forEach(k => setPref(k, 0)); }
    if (d === 'x2') { hist.push(snap()); RK.forEach(k => setPref(k, Math.min(pendMax(k), pv(k) * 2))); SND.chips(0, 2); }
    render(); });
  document.querySelectorAll('[data-spot]').forEach(b => b.onclick = () => {
    const d = b.dataset.spot;
    if (d.startsWith('bac-')) { if (pref('side', 'banker') !== d.slice(4)) { setPref('side', d.slice(4)); bumped = 'main'; SND.chips(0, 1); } }
    else spotOn = d;
    render(); });
  document.querySelectorAll('[data-bj]').forEach(b => b.onclick = () => { pressed = `data-bj="${b.dataset.bj}"`; const k = bjKey(); actSound(b.dataset.bj);
    play({ a: 'bj-act', id: T[k].id, do: b.dataset.bj }, j => { T[k] = j.hand; }, ['hit', 'double'].includes(b.dataset.bj) ? incomingCard : null); });
  document.querySelectorAll('[data-uth]').forEach(b => b.onclick = () => { pressed = `data-uth="${b.dataset.uth}"`; actSound(b.dataset.uth); play({ a: 'uth-act', id: T.uth.id, do: b.dataset.uth }, j => { T.uth = j.hand; }); });

    if (d === 'bj-deal') play({ a: 'bj', bet: pref('bj', 20) }, j => { T.bj = j.hand; });

    if (d === 'mad-deal') play({ a: 'bj', mode: 'mad', bet: pref('mad', 20), war: pref('war', 0), match: pref('match', 0) }, j => { T.mad = j.hand; });

// the move's own sound as you tap it: knock for stand / check, chips for double / split / bets, swish for fold (hit = the card)
const actSound = m => m === 'stand' || m === 'chk' ? SND.check() : m === 'fold' ? SND.fold() : ['double', 'split', 'b4', 'b2', 'b1'].includes(m) ? SND.chips(0, 3) : null;

  const ph = h.querySelector('.card.empty'); if (ph) ph.remove(); // Double Down Madness: the open spot for your second card

  const s = f.querySelector('.shoe').getBoundingClientRect(), e = el.getBoundingClientRect();

}
window.addEventListener('hashchange', () => { if (route() === 'roulette') { RL.loaded = !!RL.t; rlPoll(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && route() === 'roulette') rlPoll(); });
load().then(() => { if (route() === 'roulette') rlPoll(); });
