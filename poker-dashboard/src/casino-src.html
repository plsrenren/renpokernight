<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casino · Poker Club @ The Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=Nunito:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* Casino page: the Discord bot's games (blackjack, UTH, baccarat) with the same chips. Sign in with Discord.
   Talks to /api/casino and /api/login (served by api/_casino.js). Late Show look built in; lateshow.css is linked last like every page. */
:root {
  --page: #15132a; --panel: #1d1a37; --panel2: #2a2550; --line: #332e57;
  --fg: #ece9fb; --soft: #cfcaf0; --muted: #9a94c4;
  --gold: #f1c75b; --pink: #e0507f; --vio: #8f78f0; --up: #8ee0b0; --down: #f59bb0; --blurple: #5865f2;
  --title: "Bebas Neue", Impact, sans-serif; --body: "Space Grotesk", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  --logo: url(/icon-192.png);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--fg); font-family: var(--body); background: var(--page); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px 40px; }
a { color: inherit; }
button { cursor: pointer; border: 0; color: inherit; }
button:disabled { cursor: default; opacity: .4; }
/* header */
.top { display: flex; gap: 14px; align-items: flex-start; }
.brand { display: flex; align-items: stretch; }
.brand .lg { display: block; width: 92px; height: 78px; flex: none; }
.brand h1 { font: 400 54px/.9 var(--title); letter-spacing: .02em; margin: 6px 0 6px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.links a { text-decoration: none; }
.me { margin-left: auto; display: flex; align-items: center; gap: 10px; font: 700 14px var(--body); color: var(--soft); margin-top: 10px; white-space: nowrap; }
.me button { background: none; color: var(--muted); font: 500 12px var(--body); letter-spacing: 0; padding: 0; text-decoration: underline; }
/* avatars: initials underneath, Discord pfp on top when it loads */
.av { --h: 260; position: relative; width: 30px; height: 30px; flex: none; display: grid; place-items: center; overflow: hidden; font: 900 12px Nunito, sans-serif; background: hsl(var(--h) 75% 82%); color: hsl(var(--h) 45% 25%); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* panels + tiles */
.panel { background: var(--panel); padding: 0 18px 16px; margin-top: 16px; }
.panel h2 { display: inline-block; font: 400 26px/1 var(--title); letter-spacing: .06em; color: #fff; background: var(--vio); margin: 0 0 10px -18px; padding: 7px 26px 3px 18px; clip-path: polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%); }
.panel h2.g { background: var(--gold); color: #15132a; } .panel h2.p { background: var(--pink); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.strip { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin-top: 16px; }
.tl { background: var(--panel); border-left: 4px solid var(--vio); padding: 12px 16px; min-width: 0; }
.tl:first-child { border-left-color: var(--gold); background: linear-gradient(100deg, #3a2a6e, #a23b58); }
.tl .k { font: 400 17px var(--title); letter-spacing: .12em; color: var(--soft); }
.tl .v { font: 400 46px/.95 var(--title); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl .s { font: 500 12px var(--mono); color: var(--soft); margin-top: 4px; }
.cbtn { display: inline-block; font: 400 19px var(--title); letter-spacing: .08em; padding: 8px 18px 6px; background: var(--pink); color: #fff; clip-path: polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%); text-decoration: none; }
.cbtn.up { background: var(--up); color: #0e2a1c; } .cbtn.gold { background: var(--gold); color: #15132a; } .cbtn.ghost { background: var(--panel2); color: var(--fg); } .cbtn.vio { background: var(--vio); }
.cbtn.big { font-size: 22px; padding: 10px 24px 8px; }
/* game tiles */
.games { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.game { background: var(--panel2); padding: 12px; display: flex; flex-direction: column; gap: 6px; border-top: 4px solid var(--c); text-decoration: none; position: relative; min-height: 150px; }
.game:hover { background: #332d60; }
.game .ic { font-size: 30px; line-height: 1; }
.game b { font: 400 26px/1 var(--title); letter-spacing: .04em; }
.game span { font-size: 12px; color: var(--muted); line-height: 1.35; }
.game .go { margin-top: auto; font: 400 15px var(--title); letter-spacing: .1em; color: var(--c); }
.game.soon { opacity: .55; pointer-events: none; }
/* leaderboard + feed */
.cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
.lb { width: 100%; border-collapse: collapse; }
.lb td { padding: 5px 6px; border-bottom: 1px solid #2a2550; font-size: 14px; }
.lb td.rk { font: 400 20px var(--title); color: var(--muted); text-align: center; background: #2a2550; width: 34px; }
.lb tr:first-child td.rk { background: var(--gold); color: #15132a; }
.lb td.n { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.lb td.m { text-align: right; font: 600 14px var(--mono); white-space: nowrap; }
.lb tr.you td { background: rgba(241,199,91,.08); }
.youtag { font: 600 10px var(--mono); color: #15132a; background: var(--gold); padding: 1px 5px; }
.feed div { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 5px 0; border-bottom: 1px solid #2a2550; }
.feed small { color: var(--muted); font-size: 11px; }
.feed .who { min-width: 0; }
.feed em { display: block; font-style: normal; font-size: 11px; color: var(--gold); white-space: normal; }
.earn { background: var(--panel); border-left: 4px solid var(--gold); margin-top: 16px; }
.earn summary { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; list-style: none; }
.earn summary::-webkit-details-marker { display: none; }
.earn summary b { font: 400 22px var(--title); letter-spacing: .06em; white-space: nowrap; }
.earn summary span { color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.earn summary i { margin-left: auto; font: 400 17px var(--title); letter-spacing: .08em; color: var(--gold); font-style: normal; white-space: nowrap; }
.earn summary i::after { content: ' ▾'; } .earn[open] summary i::after { content: ' ▴'; }
.earn .groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 28px; padding: 0 16px 14px; font-size: 13px; }
.earn h3 { font: 400 16px var(--title); letter-spacing: .08em; color: var(--vio); margin: 4px 0 2px; }
.earn .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid #2a2550; }
.earn .row b { font: 500 13px var(--mono); color: var(--gold); white-space: nowrap; }
.earn .hint { padding: 6px 16px 12px; margin: 0; }
@media (max-width: 640px) { .earn .groups { grid-template-columns: 1fr; } .earn summary span { display: none; } .earn summary b { font-size: 19px; } }
.feed .amt { margin-left: auto; font-family: var(--mono); white-space: nowrap; }
.src { font: 600 10px var(--mono); padding: 1px 5px; background: #2a2550; color: var(--muted); }
.src.d { background: rgba(88,101,242,.25); color: #c9cdfb; }
.src.n { background: rgba(241,199,91,.22); color: var(--gold); }
.pos { color: var(--up); } .neg { color: var(--down); }
/* signed out */
.hero { margin-top: 16px; background: linear-gradient(100deg, #3a2a6e, #a23b58); border-left: 6px solid var(--gold); padding: 20px 22px 22px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.hero h2 { font: 400 50px/.95 var(--title); margin: 0 0 8px; letter-spacing: .02em; }
.hero p { margin: 0; color: #eee; font-size: 15px; line-height: 1.45; max-width: 560px; }
.dbtn { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--blurple); color: #fff; font: 800 17px Nunito, sans-serif; padding: 14px 22px; text-decoration: none; }
.dbtn svg { width: 24px; height: 24px; flex: none; }
.fine { font-size: 11.5px; color: #ddd; margin-top: 8px; opacity: .85; line-height: 1.4; max-width: 300px; }
.note { margin-top: 16px; padding: 10px 14px; border-left: 4px solid var(--down); background: rgba(245,155,176,.1); font-size: 14px; line-height: 1.45; }
.note.ok { border-left-color: var(--up); background: rgba(142,224,176,.1); }
/* tables */
.tablebar { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; flex-wrap: wrap; }
.tablebar h2 { margin: 0; font: 400 34px/1 var(--title); letter-spacing: .04em; }
.bal { font: 400 22px var(--title); letter-spacing: .06em; color: var(--soft); white-space: nowrap; }
.bal b { color: var(--gold); font-weight: 400; font-size: 30px; margin-left: 6px; }
.bal i { font-style: normal; font-size: 20px; margin-left: 6px; }
.felt { background: radial-gradient(120% 90% at 50% 0%, #2f5a45, #173326 70%); border: 6px solid #3a2a6e; outline: 3px solid var(--gold); padding: 18px 22px 20px; position: relative; margin-top: 12px; min-height: 330px; }
.felt .lbl { font: 400 17px var(--title); letter-spacing: .14em; color: #cfe9da; display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; min-height: 30px; white-space: nowrap; }
.felt .lbl .tot { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.felt .lbl.on { color: var(--gold); }
.tot { font: 600 14px var(--mono); background: #0e1f17; color: #fff; padding: 3px 9px; letter-spacing: 0; }
.tag { font: 900 11px Nunito, sans-serif; letter-spacing: .08em; padding: 2px 7px; }
.tag.win, .tag.bj { background: var(--up); color: #0e2a1c; } .tag.bj { background: var(--gold); color: #2a1f00; }
.tag.lose, .tag.bust, .tag.fold { background: var(--down); color: #3a0d18; } .tag.push { background: var(--muted); color: #16132b; }
.hand { display: flex; gap: 10px; margin: 8px 0 18px; flex-wrap: wrap; }
.hands { display: flex; gap: 34px; flex-wrap: wrap; }
.card { width: 74px; height: 104px; background: #f6f3ea; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 900 32px/1 Nunito, sans-serif; color: #1b1b1b; box-shadow: 0 4px 10px rgba(0,0,0,.35); flex: none; position: relative; }
.card.r { color: #c2283e; } .card i { font-style: normal; font-size: 28px; margin-top: 4px; }
.card.back { background: repeating-linear-gradient(45deg, #5a40ad 0 7px, #6e52c8 7px 14px); border: 4px solid #f6f3ea; }
.card.empty { background: rgba(255,255,255,.06); box-shadow: none; border: 2px dashed rgba(255,255,255,.18); animation: none; }
/* smooth dealing (see choreograph()): new cards fly from the shoe in deal order; a face-down card turns over */
.card.flip { animation: flipx .38s ease-in-out both; }
.card.flip::after { content: ""; position: absolute; inset: -4px; background: repeating-linear-gradient(45deg, #5a40ad 0 7px, #6e52c8 7px 14px); border: 4px solid #f6f3ea; animation: hideback .38s linear both; animation-delay: inherit; }
@keyframes flipx { 0% { transform: scaleX(1); } 50% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
@keyframes hideback { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.shoe { position: absolute; right: 14px; top: 12px; width: 50px; height: 70px; background: repeating-linear-gradient(45deg, #5a40ad 0 7px, #6e52c8 7px 14px); border: 3px solid #f6f3ea; box-shadow: 3px 3px 0 #2c1f63, 6px 6px 0 #1f1647; }
.late-hide { visibility: hidden; }
.late-show { animation: fadein .25s ease-out both; }
@keyframes fadein { from { opacity: 0; } }
.wait { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent) no-repeat; background-size: 40% 100%; animation: sweep .8s linear infinite; opacity: 0; transition: opacity .15s; }
.wait.on { opacity: 1; }
@keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }
.slots.hold{pointer-events:none}.slots.hold .cbtn{filter:saturate(.6) brightness(.9);transition:filter .2s}
.slots { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.slots .cbtn { font-size: 22px; padding: 11px 8px 9px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cbtn { transition: transform .08s, filter .12s, opacity .15s; }
.cbtn:not(:disabled):active, .chipb:not(:disabled):active, .side:active { transform: translateY(2px) scale(.97); filter: brightness(1.15); }
.cbtn.pressed:disabled { opacity: 1; filter: brightness(1.2); }
.chipb:disabled, .amt-in:disabled { opacity: .45; }
.snd { background: var(--panel2); color: var(--soft); font: 400 15px var(--title); letter-spacing: .08em; padding: 6px 10px 4px; margin-left: 10px; }
.snd[aria-pressed="true"] { color: var(--gold); }
.rules.stage { min-height: 3.2em; }
#balNum { font-variant-numeric: tabular-nums; }
.betchip { position: absolute; right: 26px; bottom: 22px; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font: 400 24px var(--title); color: #fff;
  background: radial-gradient(circle, #a23b58 0 46%, #fff 46% 50%, #a23b58 50% 62%, transparent 62%), repeating-conic-gradient(#fff 0 15deg, #a23b58 15deg 45deg); box-shadow: 0 6px 14px rgba(0,0,0,.4); }
.result { position: absolute; right: 140px; top: 52%; transform: translateY(-50%) rotate(-4deg); background: var(--gold); color: #15132a; font: 400 54px/1 var(--title); padding: 10px 26px 4px; letter-spacing: .04em; box-shadow: 0 10px 30px rgba(0,0,0,.5); text-align: center; white-space: nowrap; }
.result.slide { animation: slide .42s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes slide { from { transform: translateY(-20%) rotate(-12deg); opacity: 0; } }
.result.flat.slide, .felt.bac .result.slide { animation-name: slide2; }
@keyframes slide2 { from { transform: translateY(20px) rotate(-8deg); opacity: 0; } }
.result.lost { background: var(--down); } .result.even { background: var(--muted); }
.result small { display: block; font: 600 15px var(--mono); padding-bottom: 6px; letter-spacing: 0; }
@keyframes pop { from { transform: translateY(-50%) rotate(-4deg) scale(.6); opacity: 0; } }
@keyframes pop2 { from { transform: rotate(-2deg) scale(.6); opacity: 0; } }
.result.flat, .felt.bac .result { position: static; display: inline-block; transform: rotate(-2deg); margin-top: 10px; }
.acts { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.acts .cbtn { font-size: 22px; padding: 11px 24px 9px; }
.chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chips .lab { font: 400 18px var(--title); letter-spacing: .08em; color: var(--soft); margin-right: 4px; min-width: 64px; }
.chipb { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font: 400 17px var(--title); color: #fff; border: 4px dashed rgba(255,255,255,.7); letter-spacing: .02em; }
.chipb[aria-pressed="true"] { outline: 3px solid var(--gold); outline-offset: 2px; }
.amt-in { width: 86px; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); font: 600 15px var(--mono); padding: 10px 8px; }
.rules { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
.sync { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--soft); background: rgba(88,101,242,.16); border-left: 3px solid var(--blurple); padding: 8px 10px; }
.err { color: var(--down); font-size: 14px; margin-top: 10px; min-height: 1em; }
.lines { margin-top: 12px; display: grid; gap: 4px; font-size: 14px; }
.lines div { display: flex; gap: 8px; } .lines b { min-width: 56px; } .lines span:last-child { margin-left: auto; font-family: var(--mono); }
.sides { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.side { background: var(--panel2); padding: 12px; text-align: left; border-top: 4px solid var(--c); }
.side b { display: block; font: 400 26px/1 var(--title); letter-spacing: .04em; }
.side span { font: 500 12px var(--mono); color: var(--muted); }
.side[aria-pressed="true"] { background: #3d3577; outline: 3px solid var(--c); }
.bacrow { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.bacrow .won { outline: 3px solid var(--gold); outline-offset: 6px; }
details.pay { margin-top: 10px; font-size: 13px; color: var(--soft); line-height: 1.5; white-space: pre-line; }
details.pay summary { cursor: pointer; font: 400 17px var(--title); letter-spacing: .08em; color: var(--gold); }
.hidden { display: none !important; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
@media (max-width: 760px) {
  .games { grid-template-columns: 1fr 1fr; gap: 8px; } .game { min-height: 0; } .game span { display: none; } .game b { font-size: 22px; }
  .cols { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 14px 14px 30px; }
  .brand .lg { width: 70px; height: 60px; } .brand h1 { font-size: 38px; margin-top: 4px; }
  .links { display: none; } .me { margin-top: 4px; } .me .nm { display: none; }
  .strip { grid-template-columns: 1fr 1fr; } .strip .tl:first-child { grid-column: 1 / -1; } .tl .v { font-size: 36px; }
  .hero h2 { font-size: 40px; }
  .felt { padding: 12px 12px 14px; border-width: 4px; min-height: 280px; }
  .card { width: 52px; height: 74px; font-size: 24px; } .card i { font-size: 19px; margin-top: 2px; } .hand { gap: 6px; }
  .betchip { width: 56px; height: 56px; font-size: 17px; right: 10px; bottom: 10px; }
  /* the stamp gets a reserved strip at the bottom of the table, so a result never pushes the buttons down */
  .felt { padding-bottom: 92px; }
  .tablebar { flex-wrap: nowrap; gap: 6px; } .tablebar .cbtn { font-size: 16px; padding: 6px 14px 4px 10px; flex: none; }
  .bal { font-size: 15px; } .bal b { font-size: 23px; margin-left: 4px; } .bal i { font-size: 15px; margin-left: 4px; } .snd { font-size: 12px; padding: 5px 7px 3px; margin-left: 6px; }
  .felt.bac { min-height: 418px; }
  .result, .result.flat, .felt.bac .result { position: absolute; left: 12px; right: auto; top: auto; bottom: 12px; display: block; transform: rotate(-2deg); margin: 0; font-size: 36px; }
  .result.slide { animation-name: slide2; }
  .shoe { width: 36px; height: 50px; right: 10px; top: 10px; }
  .slots .cbtn { font-size: 19px; padding: 11px 4px 9px; }
  .acts .cbtn { flex: 1; text-align: center; font-size: 20px; padding: 11px 6px 9px; }
  .chipb { width: 42px; height: 42px; font-size: 15px; }
  .sides { gap: 6px; } .side b { font-size: 21px; }
  .bacrow { gap: 10px; }
  .uth-board .card { width: 46px; height: 66px; font-size: 21px; } .uth-board .card i { font-size: 16px; }
}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><a class="lg" href="/" aria-label="Dashboard"></a><div><h1><a href="/casino" style="text-decoration:none">The Study Casino</a></h1>
      <nav class="links"><a class="recap-link" href="/">Dashboard</a><a class="recap-link hof-link" href="/hall">🏆 Hall of Fame</a><a class="recap-link h2h-link" href="/h2h">⚔️ Head to head</a></nav></div></div>
    <div class="me hidden" id="me"></div>
  </header>
  <div id="note"></div>
  <main id="view"><p class="loading">Shuffling…</p></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '−' : '') + '$' + (Math.abs(n) % 1 ? Math.abs(n).toFixed(2) : Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const signed = n => (n > 0 ? '+' : '') + money(n);
const hue = n => [...String(n)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const initials = n => String(n).split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const av = (id, name) => `<span class="av" style="--h:${hue(name)}">${esc(initials(name))}${id ? `<img src="/api/avatar?id=${esc(id)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
const SUIT = { S: '♠', H: '♥', D: '♦', C: '♣' };
const card = c => !c || c === 'XX' ? '<div class="card back"></div>' : c === '__' ? '<div class="card empty"></div>'
  : `<div class="card${'HD'.includes(c[1]) ? ' r' : ''}">${c[0] === 'T' ? '10' : c[0]}<i>${SUIT[c[1]]}</i></div>`;

const pref = (k, d) => { try { const v = localStorage.getItem('cas.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };

let actx = null;
function tick() {             // soft card sound, only when switched on
  if (!pref('snd', false)) return;
  try { actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = 1700 + Math.random() * 500;
    g.gain.setValueAtTime(.05, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .05);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .06); } catch (e) {}
}
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

async function api(body) {
  const r = await fetch('/api/casino', body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' } : { credentials: 'same-origin', cache: 'no-store' });
  let j = {}; try { j = await r.json(); } catch (e) { j = { err: 'Something went wrong. Try again.' }; }
  if (j.signedOut) { S.me = null; render(); }
  return j;
}
async function load() {
  S = await api();
  if (S.bj) T.bj = S.bj;
  if (S.uth) T.uth = S.uth;
  render();
}
const setBal = b => { if (S.me && typeof b === 'number') S.me.bal = b; };

async function play(body, apply, early) {
  if (busy) return; busy = true; T.err = ''; render();
  if (early) early();   // something moves straight away while the server answers
  try {
    const j = await api(body);
    if (j.busy) return;
    if (j.err) { T.err = j.err; if (j.daily) S.me.daily = j.daily; return; }
    setBal(j.bal); apply(j);
  } catch (e) { T.err = "Couldn't reach the table. Check your connection."; }
  finally { busy = false; pressed = null; render(); }
}

const route = () => (location.hash || '#').slice(1);
function render() {
  if (!S) return;
  header();
  const err = new URLSearchParams(location.search).get('err');
  $('#note').innerHTML = err && ERRS[err] ? `<div class="note">${esc(ERRS[err])}</div>` : '';

// Only newly dealt cards (and a new result stamp) animate. Cards already on the table keep still when the page redraws.
// Without a set: returns what's on the table now. With one: marks the cards that were already there.
function onTable(before) {
  const now = new Set(), f = document.querySelector('.felt'), hid = route() + '|' + (f ? f.dataset.hid : '');
  now.backs = new Set();
  const mark = (el, key) => { if (before) { if (before.has(key)) el.classList.add('still'); } else now.add(key); };
  document.querySelectorAll('.felt .hand').forEach((h, i) => [...h.children].forEach((c, j) => {
    const cls = c.className.replace(/ (still|flip)/g, '');
    mark(c, `${hid}|${i}|${j}|${cls}|${c.textContent}`);
    if (!before && cls === 'card back') now.backs.add(`${hid}|${i}|${j}`);
  }));
  const st = document.querySelector('.result'); if (st) mark(st, `${hid}|result|${st.textContent}`);
  return now;
}
// Plays out what just changed: new cards fly from the shoe one at a time in deal order (you, dealer, you, dealer),
// a face-down card turns over, the dealer's extra cards come out with a pause each, and only then do the totals,
// result and new balance show. The server already settled the hand; this is just how it's shown.
function choreograph(before) {
  const f = document.querySelector('.felt');
  if (!f) return rollBal(0);
  const hid = route() + '|' + f.dataset.hid, dealerRow = f.dataset.dealer === undefined ? -1 : +f.dataset.dealer;
  const fresh = []; let anyStill = false;
  f.querySelectorAll('.hand').forEach((h, i) => [...h.children].forEach((c, j) => {
    if (c.classList.contains('still')) { anyStill = true; return; }
    if (c.classList.contains('empty')) return;
    fresh.push({ c, i, j, flip: before.backs.has(`${hid}|${i}|${j}`) && !c.classList.contains('back') });
  }));
  const initial = !anyStill;
  const order = x => (x.i === dealerRow && !initial ? 1000 : 0) + x.j * 10 + (x.i === dealerRow ? 5 : x.i);
  fresh.sort((a, b) => order(a) - order(b));
  const shoe = f.querySelector('.shoe'), sr = shoe ? shoe.getBoundingClientRect() : f.getBoundingClientRect();
  let t = 0;
  fresh.forEach((x, k) => {
    if (k) t += fresh[k - 1].flip ? 380 : x.j >= 2 ? 420 : 170;
    if (REDUCED) return;
    setTimeout(tick, t);
    if (x.flip) { x.c.style.animationDelay = t + 'ms'; x.c.classList.add('flip'); return; }
    const e = x.c.getBoundingClientRect();
    x.c.animate([{ transform: `translate(${sr.left - e.left}px, ${sr.top - e.top}px) rotate(-12deg) scale(.8)`, opacity: .9 }, { transform: 'none', opacity: 1 }],
      { duration: 300, delay: t, easing: 'cubic-bezier(.2,.8,.25,1)', fill: 'backwards' });
  });
  const end = fresh.length && !REDUCED ? t + 380 : 0;
  // totals, tags, result and bet lines wait for the cards
  const late = [...document.querySelectorAll('#view [data-late]')];
  const show = () => late.forEach(el => { el.classList.remove('late-hide'); if (!el.classList.contains('still')) el.classList.add(el.classList.contains('result') ? 'slide' : 'late-show'); });
  const row = document.querySelector('#view .slots');
  if (end) { late.forEach(el => el.classList.add('late-hide')); if (row) row.classList.add('hold'); setTimeout(() => { show(); if (row) row.classList.remove('hold'); }, end); } else show();
  rollBal(end);
}
// the balance on screen rolls to the new number once the hand has played out
function rollBal(delay) {
  const el = document.getElementById('balNum');
  if (!S.me) return;
  const to = S.me.bal || 0, from = shownBal === null ? to : shownBal;
  shownBal = to;
  if (!el) return;
  if (from === to || REDUCED) { el.textContent = money(to); return; }
  el.textContent = money(from);
  setTimeout(() => {
    const t0 = performance.now(), run = now => { const k = Math.min(1, (now - t0) / 520), e = 1 - Math.pow(1 - k, 3), v = from + (to - from) * e;
      el.textContent = money(k < 1 ? Math.round(v) : to); if (k < 1) requestAnimationFrame(run); };
    requestAnimationFrame(run);
  }, delay);
}

  const slots = `<div class="slots" style="--n:2">${!live ? btn('data-do="uth-deal"', `Deal ${money(ante * 2 + trips)}`, 'gold') : st === 'pre' ? b(4, 'gold') : st === 'flop' ? b(2, 'gold') : b(1, 'gold')}

  return `${balBar("Ultimate Hold'em", done ? g.net : 0)}${felt(g ? g.id : '', inner)}${slots}<div class="err">${esc(T.err)}</div>${lines}${controls}

// ---------- baccarat ----------
function baccarat() {
  const r = T.bac, bet = pref('bac', 20), side = pref('side', 'banker');
  const SIDES = { player: ['Player', 'pays 1:1', 'var(--vio)'], banker: ['Banker', 'pays 0.95:1', 'var(--gold)'], tie: ['Tie', 'pays 8:1', 'var(--up)'] };
  let inner = `<div class="bacrow"><div><div class="lbl">Player</div><div class="hand">${card('__')}${card('__')}</div></div><div><div class="lbl">Banker</div><div class="hand">${card('__')}${card('__')}</div></div></div>`;
  if (r) {
    const c = r.coup, w = c.winner;
    inner = `<div class="bacrow"><div><div class="lbl">Player <span class="tot" data-late>${c.ps}</span>${w === 'player' ? '<span data-late class="tag win">WINS</span>' : ''}</div><div class="hand">${c.p.map(card).join('')}</div></div>
      <div><div class="lbl">Banker <span class="tot" data-late>${c.bs}</span>${w === 'banker' ? '<span data-late class="tag win">WINS</span>' : ''}</div><div class="hand">${c.b.map(card).join('')}</div></div></div>
      <div class="lbl" data-late style="margin-top:6px">${w === 'tie' ? `Tie ${c.ps}–${c.bs}` : `${SIDES[w][0]} wins ${Math.max(c.ps, c.bs)}–${Math.min(c.ps, c.bs)}`}${c.natural ? ' · natural' : ''} · you bet ${money(r.bet)} on ${SIDES[r.side][0]}</div>
      ${resultStamp(r.net)}`;
  }
  return `${balBar('Baccarat', r ? r.net : 0)}${felt(r ? r.n : '', inner, ' bac')}
    <div class="acts" style="display:block"><div class="sides">${Object.entries(SIDES).map(([k, [n, p, c]]) => `<button class="side" style="--c:${c}" data-side="${k}" aria-pressed="${k === side}"><b>${n}</b><span>${p}</span></button>`).join('')}</div></div>
    <div class="acts">${chipPicker('bac', [5, 20, 50, 100, 500], bet, 'Bet')}</div>
    <div class="slots" style="--n:1">${btn('data-do="bac-deal"', `Deal ${money(bet)} on ${SIDES[side][0]}`, 'gold')}</div><div class="err">${esc(T.err)}</div>
    <p class="rules">Fresh 6-deck shoe each hand, standard third-card rules. Player and Banker bets push on a tie. Same as /baccarat.</p>${syncLine}`;
}

// ---------- buttons ----------
const LIMIT = { bj: [1, () => S.maxBet], bac: [1, () => S.maxBet], ante: [1, () => S.maxAnte], trips: [0, () => S.maxTrips] };
const clamp = (k, v) => Math.min(LIMIT[k][1](), Math.max(LIMIT[k][0], Math.floor(+v || 0)));
function wire() {
  document.querySelectorAll('[data-bj],[data-uth],[data-do]').forEach(b => b.addEventListener('pointerdown', () => { b.classList.add('pressed'); }));
  document.querySelectorAll('details.earn').forEach(d => d.ontoggle = () => setPref('earn', d.open));
  document.querySelectorAll('[data-snd]').forEach(b => b.onclick = () => { setPref('snd', !pref('snd', false)); render(); tick(); });
  document.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { setPref(b.dataset.chip, clamp(b.dataset.chip, b.dataset.v)); render(); });
  document.querySelectorAll('[data-amt]').forEach(i => i.onchange = () => { setPref(i.dataset.amt, clamp(i.dataset.amt, i.value)); render(); });
  document.querySelectorAll('[data-side]').forEach(b => b.onclick = () => { setPref('side', b.dataset.side); render(); });
  document.querySelectorAll('[data-bj]').forEach(b => b.onclick = () => { pressed = `data-bj="${b.dataset.bj}"`;
    play({ a: 'bj-act', id: T.bj.id, do: b.dataset.bj }, j => { T.bj = j.hand; }, ['hit', 'double'].includes(b.dataset.bj) ? incomingCard : null); });
  document.querySelectorAll('[data-uth]').forEach(b => b.onclick = () => { pressed = `data-uth="${b.dataset.uth}"`; play({ a: 'uth-act', id: T.uth.id, do: b.dataset.uth }, j => { T.uth = j.hand; }); });
  document.querySelectorAll('[data-do]').forEach(b => b.onclick = () => {
    const d = b.dataset.do; pressed = `data-do="${d}"`;
    if (d === 'daily') play({ a: 'daily' }, j => { S.me.daily = j.daily; T.got = j.got; T.first = j.first; load(); });
    if (d === 'bj-deal') play({ a: 'bj', bet: pref('bj', 20) }, j => { T.bj = j.hand; });
    if (d === 'uth-deal') play({ a: 'uth', ante: pref('ante', 10), trips: pref('trips', 0) }, j => { T.uth = j.hand; });
    if (d === 'bac-deal') { const bet = pref('bac', 20), side = pref('side', 'banker'); play({ a: 'bac', bet, side }, j => { T.bac = { ...j, bet, n: (T.bac ? T.bac.n : 0) + 1 }; }); }
  });
  if (busy) document.querySelectorAll('[data-bj],[data-uth],[data-do]').forEach(b => b.disabled = true);
}
// On Hit or Double a face-down card flies to your hand at once; it turns over when the server says what it is.
function incomingCard() {
  const g = T.bj, f = document.querySelector('.felt');
  if (!g || !f || REDUCED) return;
  const hands = f.querySelectorAll('.hands .hand'), h = hands[g.active] || hands[0];
  if (!h) return;
  const el = document.createElement('div'); el.className = 'card back'; h.appendChild(el); tick();
  const s = f.querySelector('.shoe').getBoundingClientRect(), e = el.getBoundingClientRect();
  el.animate([{ transform: `translate(${s.left - e.left}px, ${s.top - e.top}px) rotate(-12deg) scale(.8)` }, { transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2,.8,.25,1)' });
}
load();
</script>
