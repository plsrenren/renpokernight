<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker Room · Poker Club @ The Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=Nunito:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* Poker room: one host-run no-limit Hold'em table for casino chips. Talks to /api/poker (api/_poker.js, rules in _pokergame.js),
   live updates through Ably (/ably.min.js, self-hosted), polling when Ably isn't there. Seat look = mockup style B (nameplate)
   with angled broadcast cards; each seat wears the player's border, bar wash and sticker (plates.js); tap a seat for the title. */
:root {
  --page: #15132a; --panel: #1d1a37; --panel2: #2a2550; --line: #332e57;
  --fg: #ece9fb; --soft: #cfcaf0; --muted: #9a94c4;
  --gold: #f1c75b; --pink: #e0507f; --vio: #8f78f0; --up: #8ee0b0; --down: #f59bb0; --blurple: #5865f2;
  --felt1: #2f5a45; --felt2: #173326; --ink: #15132a; --cardbg: #f6f3ea; --red: #c2283e;
  --title: "Bebas Neue", Impact, sans-serif; --body: "Space Grotesk", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; --round: Nunito, system-ui, sans-serif;
  --logo: url(/icon-192.png);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--fg); font-family: var(--body); background: var(--page); -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 40px; }
a { color: inherit; }
button { cursor: pointer; border: 0; color: inherit; font: inherit; }
button:disabled { cursor: default; opacity: .4; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hidden { display: none !important; }
.top { display: flex; gap: 14px; align-items: flex-start; }
.brand { display: flex; align-items: stretch; }
.brand .lg { display: block; width: 92px; height: 78px; flex: none; }
.brand h1 { font: 400 54px/.9 var(--title); letter-spacing: .02em; margin: 6px 0 6px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.links a { text-decoration: none; }
.me { margin-left: auto; display: flex; align-items: center; gap: 10px; font: 700 14px var(--body); color: var(--soft); margin-top: 10px; white-space: nowrap; }
.me .bal { font: 400 22px var(--title); letter-spacing: .05em; color: var(--gold); }
.av { --h: 260; position: relative; width: 30px; height: 30px; flex: none; display: grid; place-items: center; overflow: hidden; font: 900 12px var(--round); background: hsl(var(--h) 75% 82%); color: hsl(var(--h) 45% 25%); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cbtn { display: inline-block; font: 400 19px var(--title); letter-spacing: .08em; padding: 8px 18px 6px; background: var(--pink); color: #fff; clip-path: polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%); text-decoration: none; }
.cbtn.up { background: var(--up); color: #0e2a1c; } .cbtn.gold { background: var(--gold); color: var(--ink); } .cbtn.ghost { background: var(--panel2); color: var(--fg); }
.cbtn.sm { font-size: 16px; padding: 6px 14px 4px; }
.panel { background: var(--panel); padding: 0 16px 14px; }
.panel h2 { display: inline-block; font: 400 24px/1 var(--title); letter-spacing: .06em; color: #fff; background: var(--vio); margin: 0 0 10px -16px; padding: 7px 24px 3px 16px; clip-path: polygon(0 0,100% 0,calc(100% - 13px) 100%,0 100%); }
.panel h2.g { background: var(--gold); color: var(--ink); } .panel h2.p { background: var(--pink); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; line-height: 1.45; }
.note { margin-top: 16px; padding: 10px 14px; border-left: 4px solid var(--down); background: rgba(245,155,176,.1); font-size: 14px; line-height: 1.45; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
.hero { margin-top: 16px; background: linear-gradient(100deg, #3a2a6e, #a23b58); border-left: 6px solid var(--gold); padding: 20px 22px 22px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.hero h2 { font: 400 50px/.95 var(--title); margin: 0 0 8px; letter-spacing: .02em; }
.hero p { margin: 0; color: #eee; font-size: 15px; line-height: 1.45; max-width: 560px; }
.dbtn { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--blurple); color: #fff; font: 800 17px var(--round); padding: 14px 22px; text-decoration: none; }
.dbtn svg { width: 24px; height: 24px; flex: none; }
.lobby { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.tcard { background: linear-gradient(100deg, #2a2550, #3a2a4e); border-left: 6px solid var(--muted); padding: 18px 20px; display: grid; gap: 10px; }
.tcard h3 { font: 400 40px/.95 var(--title); margin: 0; letter-spacing: .02em; }
.tcard p { margin: 0; color: var(--soft); font-size: 14px; line-height: 1.45; }
.rules li { margin: 0 0 7px; font-size: 13.5px; line-height: 1.4; color: var(--soft); }
.rules { padding-left: 18px; margin: 0; }

/* table */
.tbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; position: relative; z-index: 30; }
.popbar { display: flex; gap: 8px; }
.popbtn.on { background: var(--gold); color: var(--ink); } .hostbtn { background: var(--pink); color: #fff; }
.pop .hlog { max-height: min(420px, calc(100vh - 220px)); }
.pop { position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 140px); overflow-y: auto; box-shadow: 0 18px 40px rgba(0,0,0,.55); border: 2px solid var(--vio); } .pop.host { border-color: var(--pink); }
.tbar .info { font: 400 20px var(--title); letter-spacing: .06em; color: var(--soft); margin-right: auto; white-space: nowrap; }
.tbar .info b { color: var(--gold); font-weight: 400; }
.tbtns { display: flex; gap: 8px; align-items: center; }
.live { font: 600 10.5px var(--mono); padding: 2px 6px; background: var(--panel2); color: var(--muted); vertical-align: middle; margin-left: 6px; letter-spacing: 0; }
.live.on { background: rgba(142,224,176,.18); color: var(--up); }
.game { display: grid; gap: 16px; margin-top: 12px; }
/* the open room uses the whole browser width; log, rules and host controls drop down from buttons at the top right */
body.room .wrap { max-width: none; }
.felt { position: relative; aspect-ratio: 2 / 1; width: 100%; max-height: max(360px, calc(100vh - 400px)); margin-block: 14px; }
.oval { position: absolute; inset: 9% 7%; border-radius: 50%; background: radial-gradient(120% 90% at 50% 20%, var(--felt1), var(--felt2) 72%); border: 10px solid #3a2a6e; outline: 3px solid var(--gold); box-shadow: inset 0 0 40px rgba(0,0,0,.45); }
.oval::after { content: "THE STUDY"; position: absolute; left: 50%; top: 70%; transform: translateX(-50%); font: 400 22px var(--title); letter-spacing: .4em; color: rgba(255,255,255,.07); white-space: nowrap; }
.center { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 8px; width: 56%; }
.crow { height: 30px; display: grid; place-items: center; width: 100%; }
.pot { font: 400 20px/1 var(--title); letter-spacing: .05em; background: var(--gold); color: var(--ink); padding: 5px 12px 3px; white-space: nowrap; text-transform: uppercase; }
.bd5 { display: flex; gap: 6px; min-height: 82px; perspective: 800px; }
.bd5 .cd { width: 58px; height: 82px; font-size: 27px; position: relative; } .bd5 .cd i { font-size: 22px; }
.cd .bk { position: absolute; inset: 0; background: repeating-linear-gradient(45deg, #5a40ad 0 6px, #6e52c8 6px 12px); border: 3px solid var(--cardbg); pointer-events: none; opacity: 0; }
.cd.sc, .cd.lg { position: relative; }
.banner.allin { background: var(--pink); color: #fff; }
.felt .oval, .felt .st, .felt .bet { transition: filter .35s; }
.felt.dim .oval { filter: brightness(.45); } .felt.dim .st:not(.lit), .felt.dim .bet { filter: brightness(.55); }
.st.lit { z-index: 8; } .st.lit .st-name { box-shadow: 0 0 0 2px var(--gold), 0 0 22px 6px rgba(241,199,91,.45); } .st.lit .pfw { filter: drop-shadow(0 0 10px rgba(241,199,91,.85)); }
.spot { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,240,200,.26), transparent 65%); transform: translate(-50%, -50%); pointer-events: none; z-index: 1; }
.potfly { position: absolute; display: flex; gap: 2px; z-index: 9; pointer-events: none; }
.banner { font: 400 18px/1.1 var(--title); letter-spacing: .05em; color: var(--ink); background: var(--gold); padding: 5px 10px 3px; text-align: center; max-width: 100%; }
.banner.sub { background: rgba(21,19,42,.8); color: var(--gold); font-size: 15px; }
.cd { width: 44px; height: 62px; background: var(--cardbg); color: #1b1b1b; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 900 20px/1 var(--round); box-shadow: 0 3px 8px rgba(0,0,0,.4); flex: none; transition: transform .2s, opacity .2s; }
.cd i { font-style: normal; font-size: 17px; margin-top: 2px; }
/* four-color deck: spades black, hearts red, diamonds blue, clubs green */
.cd.su-h { color: var(--red); } .cd.su-d { color: #2c63d6; } .cd.su-c { color: #1f8a4c; }
/* hover a card to see it bigger (mouse only) */
@media (hover: hover) {
  .cd.face { cursor: zoom-in; }
  /* 'scale' stacks on top of the card's own transform, so it grows right where it sits, same angle */
  .cd.face { transition: transform .2s, opacity .2s, scale .15s; }
  html body .cd.face:hover { scale: 1.6; z-index: 6; box-shadow: 0 10px 24px rgba(0,0,0,.6); position: relative; }
  html body .cd.face.lg:hover { scale: 1.3; }
  html body .cd.face.dim:hover { opacity: 1; }
  .st:has(.cd.face:hover) { z-index: 20; }
}
.cd.back { background: repeating-linear-gradient(45deg, #5a40ad 0 6px, #6e52c8 6px 12px); border: 3px solid var(--cardbg); }
.cd.ph { background: rgba(0,0,0,.18); box-shadow: none; border: 2px dashed rgba(255,255,255,.12); }
.cd.dim { opacity: .45; } .cd.fold { filter: brightness(.5) saturate(.5); opacity: .75; } .cd.hl { transform: translateY(-6px); box-shadow: 0 0 0 3px var(--gold), 0 6px 14px rgba(0,0,0,.5); }
.cd.lg { width: 66px; height: 92px; font-size: 30px; } .cd.lg i { font-size: 25px; }
.cd.sc { width: 42px; height: 59px; font-size: 21px; } .cd.sc i { font-size: 17px; margin-top: 1px; }
.st { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; z-index: 2; cursor: pointer; }
.st-row { display: flex; align-items: center; }
.st-cards { display: flex; margin-left: -10px; position: relative; z-index: 2; }
.st-cards .cd:first-child { transform: rotate(-5deg); }
.st-cards .cd + .cd { margin-left: -16px; transform: rotate(6deg) translateY(2px); }
.st-cards .cd.hl { transform: translateY(-6px); }
.st-name { position: relative; display: flex; justify-content: space-between; gap: 8px; width: 100%; min-width: 118px; margin-top: 4px; padding: 3px 8px 3px 7px; background: #1d1a37; border-left: 3px solid #4a4380; }
.st-name b { font: 700 12.5px/1.2 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
.st-name span.sk { font: 600 12px/1.2 var(--mono); color: var(--gold); white-space: nowrap; }
.st-name .pl-bg { opacity: .55; }
.st-stk { position: absolute; right: -12px; bottom: 12px; z-index: 5; line-height: 0; pointer-events: none; }
.st-stk .pl-stk { width: 26px; height: 26px; margin: 0; }
.st.active .st-name { box-shadow: 0 0 0 2px var(--gold); }
.st.win .st-name { box-shadow: 0 0 0 2px var(--up); }
.st.folded .st-row, .st.folded .st-name { opacity: .45; }
.st.out .st-row, .st.out .st-name { opacity: .32; }
.st .act { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font: 900 10.5px var(--round); letter-spacing: .04em; background: var(--panel2); color: var(--fg); padding: 2px 6px; white-space: nowrap; z-index: 4; text-transform: uppercase; }
.st .act.fold { background: #3a3560; color: var(--muted); } .st .act.raise { background: var(--pink); color: #fff; } .st .act.allin { background: var(--gold); color: var(--ink); } .st .act.win { background: var(--up); color: #0e2a1c; }
.st-peek { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; background: var(--ink); padding: 4px 8px 3px; white-space: nowrap; z-index: 6; }
.st-peek .pl-ttl { margin: 0; }
.st-peek small { font: 500 10px var(--mono); color: var(--muted); }
.tmr { width: 100%; height: 4px; background: rgba(0,0,0,.35); margin-top: 3px; overflow: hidden; }
.tmr i { display: block; height: 100%; background: var(--gold); transform-origin: left; animation: tick linear forwards; }
@keyframes tick { from { transform: scaleX(1); } 80% { background: var(--gold); } to { transform: scaleX(0); background: var(--pink); } }
.st.empty { cursor: default; }
.st.empty button { font: 400 15px var(--title); letter-spacing: .08em; width: 64px; height: 48px; border: 2px dashed rgba(255,255,255,.3); background: rgba(0,0,0,.2); color: var(--soft); }
.st.empty button:hover { border-color: var(--gold); color: var(--gold); }
.st.empty .lbl { width: 54px; height: 44px; border: 2px dashed rgba(255,255,255,.12); }
.bet { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: flex-end; gap: 4px; white-space: nowrap; z-index: 1; }
.bet .stks { display: flex; align-items: flex-end; gap: 3px; }
.stk { position: relative; width: 20px; display: block; }
.stk i { position: absolute; left: 0; width: 20px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -1px 0 rgba(0,0,0,.35), 0 1px 0 rgba(0,0,0,.45); }
.stk i::after { content: ""; position: absolute; inset: 1px 4px; border-top: 2px dashed rgba(255,255,255,.75); border-radius: 50%; }
.stk .k1 { --c: #f2f2f2; } .stk .k1::after { border-color: #3b6fd6; } .stk .k5 { --c: #d93a4a; } .stk .k25 { --c: #2e9e5b; } .stk .k500 { --c: #8f78f0; }
.stk .k100 { --c: #22202f; box-shadow: inset 0 -1px 0 rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.55); }
.bet .tag { display: grid; font: 400 12px/1 var(--title); letter-spacing: .08em; }
.bet .tag span { background: var(--ink); color: var(--soft); padding: 3px 7px 1px; justify-self: start; }
.bet .tag b { font: 400 20px/1 var(--title); letter-spacing: .03em; font-weight: 400; padding: 4px 12px 2px 8px; background: var(--soft); color: var(--ink); clip-path: polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%); }
.bet.raise .tag b { background: var(--pink); color: #fff; } .bet.allin .tag b { background: #e2394f; color: #fff; } .bet.call .tag b { background: var(--up); color: #0e2a1c; }
.pchip { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, var(--pink) 0 38%, #fff 40% 52%, var(--pink) 54%); flex: none; }
.dmark { display: none; }
.dbtn2 { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: #fff; color: var(--ink); font: 900 12px/22px var(--round); text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,.5); z-index: 1; }

.actbar { background: var(--panel); padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; height: 140px; overflow: hidden; }
.actbar.guest { grid-template-columns: minmax(0, 1fr) auto; }
.mine { display: grid; gap: 6px; justify-items: center; }
.mine .cards { display: flex; gap: 6px; }
.mine .str { font: 600 11.5px var(--mono); color: var(--gold); white-space: nowrap; }
.ctrls { display: grid; gap: 8px; min-width: 0; }
.ctrls .btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ctrls .btns .cbtn { text-align: center; padding-inline: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { font: 600 12px var(--mono); background: var(--panel2); padding: 5px 9px; }
.slide { display: flex; gap: 10px; align-items: center; }
.slide input { flex: 1; min-width: 0; accent-color: var(--gold); }
.slide output { font: 600 14px var(--mono); color: var(--gold); min-width: 64px; text-align: right; }
.wait { font: 400 22px var(--title); letter-spacing: .05em; color: var(--soft); }
.wait small { display: block; font: 500 12px var(--body); color: var(--muted); letter-spacing: 0; margin-top: 4px; }
.wait .cbtn { margin-top: 8px; }
.err { color: var(--down); font-size: 13px; }

.side { display: grid; gap: 16px; min-width: 0; }
.chat { height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.35; padding-right: 4px; }
.chat div b { color: var(--gold); }
.chat .sys { color: var(--muted); font-size: 12px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.quick button { font: 700 12px var(--body); background: var(--panel2); padding: 5px 10px; }
.say { display: flex; gap: 6px; margin-top: 8px; }
.say input { flex: 1; min-width: 0; font: 500 13px var(--body); background: var(--panel2); color: var(--fg); border: 0; padding: 7px 9px; }
details.fold summary { list-style: none; cursor: pointer; } details.fold summary::-webkit-details-marker { display: none; }
details.fold summary h2::after { content: ' ▾'; } details.fold[open] summary h2::after { content: ' ▴'; }
details.fold:not([open]) { padding-bottom: 0; }
details.fold > summary + * { margin-top: 10px; }
.hlog { max-height: 220px; overflow-y: auto; font-size: 12.5px; color: var(--soft); line-height: 1.4; }
.hlog div.h { font: 400 15px var(--title); letter-spacing: .08em; color: var(--vio); margin-top: 6px; }
.host select { font: 600 13px var(--mono); background: var(--panel2); color: var(--fg); border: 0; padding: 6px 8px; margin-top: 4px; width: 100%; }
.hgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.host label { font: 500 12px var(--mono); color: var(--muted); display: grid; }
.host label.chk { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.host label.hl1 { margin: 10px 0 8px; }
.hrow { display: flex; gap: 8px; flex-wrap: wrap; }
.hx { display: grid; gap: 6px; margin: 12px 0 2px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
.hx div { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
.hx b { min-width: 72px; }
.hx small { color: var(--muted); font: 500 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hx select { margin: 0 0 0 auto; width: auto; }
.hx small + .cbtn, .hx select + .cbtn { margin-left: 0; }
.hx div > .cbtn { min-width: 78px; text-align: center; font-size: 14px; padding: 4px 10px 3px; }
.hx div > small { margin-left: auto; }
.tbar .xtra { color: var(--gold); }
.pfw { position: relative; }
.nitmark { position: absolute; right: -8px; top: -7px; background: var(--red); color: #fff; font: 800 8.5px/1 var(--round); font-style: normal; letter-spacing: .04em; padding: 3px 4px 2px; z-index: 4; box-shadow: 0 2px 4px rgba(0,0,0,.5); pointer-events: none; }
.plist { display: grid; gap: 6px; margin-bottom: 10px; }
.plist div { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.plist .av { width: 26px; height: 26px; font-size: 10px; }
.plist b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist small { color: var(--muted); font: 500 11px var(--mono); margin-left: auto; white-space: nowrap; }
.plist .cbtn { font-size: 14px; padding: 4px 10px 3px; min-width: 78px; text-align: center; }

.modal { position: fixed; inset: 0; background: rgba(10,9,24,.72); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal .box { background: var(--panel); border-left: 6px solid var(--gold); padding: 18px 20px; width: min(420px, 100%); display: grid; gap: 12px; }
.modal h3 { font: 400 34px/.95 var(--title); margin: 0; }
.modal p { margin: 0; color: var(--soft); font-size: 14px; line-height: 1.45; }
.modal .amt { font: 400 48px/.9 var(--title); color: var(--gold); }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.modal input[type=range] { width: 100%; accent-color: var(--gold); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--up); color: #0e2a1c; font: 700 14px var(--body); padding: 10px 16px; z-index: 70; max-width: calc(100% - 32px); }
.toast.bad { background: var(--down); color: #3a0d18; }

@media (max-width: 900px) { .lobby { grid-template-columns: minmax(0, 1fr); } .felt { aspect-ratio: 16 / 10; } .hero { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .wrap { padding: 14px 14px 30px; }
  .brand .lg { width: 70px; height: 60px; } .brand h1 { font-size: 38px; margin-top: 4px; }

  draw();
  if (disp) fxAfter(disp); else prevView = null;
}
function draw() {
  if (!S || !S.table) return;
  document.body.classList.toggle('seated', mySeat() >= 0);
  document.body.classList.toggle('room', !!(S.table && S.table.open));
  const raiseFocus = $('#raise') && document.activeElement === $('#raise');
  const hl = $('#pop .hlog'); if (hl) logScroll = hl.scrollHeight - hl.scrollTop - hl.clientHeight < 8 ? null : hl.scrollTop;
  header();
  const qerr = new URLSearchParams(location.search).get('err');
  $('#note').innerHTML = qerr && ERRS[qerr] ? `<div class="note">${esc(ERRS[qerr])}</div>` : '';
  const t = T(), v = $('#view');
  if (!S.me && t.open) { // signing in is optional: guests watch the table and the chat live
    v.innerHTML = `<div class="tbar"><div class="info${extras(t) ? ' hasx' : ''}">${money(t.cfg.sb)}/${money(t.cfg.bb)}<span class="hno"> · Hand <b>#${t.hand || 0}</b></span>${extras(t)}<span class="live" id="live"></span></div>
        <div class="tbtns">${popBar(t)}</div></div>
      <div class="game"><div>${tableHTML()}<div class="actbar guest"><div class="wait">You're watching</div><a class="dbtn" href="/api/login?to=poker">${DISCORD_SVG}Sign in with Discord</a></div></div></div>`;
    keepLog();
    renderLive();
    return;
  }
  if (!S.me) {
    v.innerHTML = `<section class="hero"><div><h2>${t.open ? 'The poker room is open' : 'The poker room'}</h2><p>${t.open ? `No-limit Hold'em, blinds ${money(t.cfg.sb)}/${money(t.cfg.bb)}. ${t.seats.filter(s => s && !s.left).length} of 8 seats taken. ` : 'A host opens it on game night, and anyone can watch. '}Sign in with Discord to sit down with your casino chips.</p></div>
      <div><a class="dbtn" href="/api/login?to=poker">${DISCORD_SVG}Sign in with Discord</a></div></section>`;
    return;
  }
  if (!t.open) {
    v.innerHTML = `<div class="lobby"><div class="tcard"><h3>The room is closed</h3><p>A host opens it on game night, and it gets posted in #the-table. You have ${money(S.me.bal)} in casino chips.</p></div>
      <div class="side">${hostHTML()}<div class="panel"><h2 class="g">How it works</h2>${rulesHTML(t.cfg)}</div></div></div>`;
    return;
  }
  const i = mySeat(), s = i >= 0 ? t.seats[i] : null;
  v.innerHTML = `<div class="tbar"><div class="info${extras(t) ? ' hasx' : ''}">${money(t.cfg.sb)}/${money(t.cfg.bb)}<span class="hno"> · Hand <b>#${t.hand || 0}</b></span>${extras(t)}<span class="live" id="live"></span></div>
      <div class="tbtns">${s ? `<button class="cbtn ghost sm" data-a="top" ${s.stack + (s.pend || 0) >= t.cfg.max ? 'disabled' : ''}>Top up</button>
      <button class="cbtn ghost sm" data-a="${s.out ? 'back' : 'sitout'}">${s.out ? "I'm back" : 'Sit out'}</button>
      <button class="cbtn sm" data-a="leave">Leave<span class="wide"> table</span></button>` : ''}
      ${popBar(t)}</div></div>
    <div class="game"><div>${tableHTML()}${actHTML()}</div></div>`;
  renderLive();
  const r = $('#raise');
  if (r) {
    if (raiseKeep.k === turnKey(t)) r.value = raiseKeep.v;
    const show = () => { raiseKeep = { k: turnKey(T()), v: +r.value }; $('#raiseOut').textContent = money(+r.value); const s2 = T().seats[mySeat()]; $('#raiseBtn').textContent = +r.value >= s2.bet + s2.stack ? 'All in ' + money(+r.value) : (T().curBet === 0 ? 'Bet ' : 'Raise ') + money(+r.value); };
    r.addEventListener('input', show); show(); if (raiseFocus) r.focus();
  }
  keepLog();
}
function keepLog() { const h = $('#pop .hlog'); if (h) h.scrollTop = logScroll === null ? h.scrollHeight : logScroll; }
function toast(text, bad) { const d = document.createElement('div'); d.className = 'toast' + (bad ? ' bad' : ''); d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 2800); }

// ---------- modals ----------
function modal(kind, seat) {
  const t = T(), m = $('#modal'), i = mySeat(), s = i >= 0 ? t.seats[i] : null;
  if (kind === 'sit' || kind === 'top') {
    const room = kind === 'top' ? t.cfg.max - s.stack - (s.pend || 0) : t.cfg.max;
    const max = Math.floor(Math.min(room, S.me.bal)), min = kind === 'top' ? 1 : t.cfg.min;
    if (max < min) return toast(kind === 'top' ? `You can have up to ${money(t.cfg.max)} in front of you.` : `You need ${money(t.cfg.min)} in chips to sit down. You have ${money(S.me.bal)}.`, true);
    m.innerHTML = `<div class="modal"><form class="box" id="buyF"><h3>${kind === 'top' ? (s.stack ? 'Top up' : 'Rebuy') : 'Buy in'}</h3>
      ${kind === 'top' ? `<p>Up to ${money(t.cfg.max)} in front of you.</p>` : ''}
      <div class="amt" id="buyAmt">${money(max)}</div><input type="range" id="buyR" min="${min}" max="${max}" step="1" value="${max}" aria-label="Amount">
      <p style="font:500 12px var(--mono);color:var(--muted)">Casino chips after: <span id="buyLeft">${money(S.me.bal - max)}</span></p>
      <div class="row"><button class="cbtn gold">${kind === 'top' ? 'Add chips' : 'Sit down'}</button><button type="button" class="cbtn ghost" data-close>Cancel</button></div></form></div>`;
    const r = $('#buyR'); r.addEventListener('input', () => { $('#buyAmt').textContent = money(+r.value); $('#buyLeft').textContent = money(S.me.bal - r.value); });
    $('#buyF').onsubmit = e => { e.preventDefault(); m.innerHTML = ''; send(kind === 'sit' ? { a: 'sit', seat, amt: +r.value } : { a: 'top', amt: +r.value }); };
  } else if (kind === 'leave') {
    const amt = s.stack + (s.pend || 0), inHand = t.phase === 'hand' && s.dealt && !s.folded;
    m.innerHTML = `<div class="modal"><div class="box"><h3>Leave the table?</h3><p>${inHand ? 'You are in a hand, so leaving folds your cards. ' : ''}Your ${money(amt)} goes back to your casino chips.</p>
      <div class="row"><button class="cbtn" data-confirm="leave">Leave and cash out</button><button class="cbtn ghost" data-close>Stay</button></div></div></div>`;
  }
}
async function send(body) {
  if (busy && body.a === 'act') return;
  busy = true; err = '';
  try {
    const before = S.me ? S.me.bal : 0;
    const j = await api(body);
    if (j.err) { toast(j.err, true); render(); }
    else if (body.a === 'leave') toast(`${money(j.me.bal - before)} went back to your casino chips`);
    else if (body.a === 'sit') toast("You're in. You'll be dealt in next hand.");
  } catch (e) { toast("Couldn't reach the table. Try again.", true); }
  busy = false;
}

// ---------- clicks ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (pop && !e.target.closest('#pop') && !(b && b.dataset.pop)) { pop = ''; render(); if (!b) return; } // tap outside closes it
  if (b && b.dataset.pop) { pop = pop === b.dataset.pop ? '' : b.dataset.pop; logScroll = null; return render(); }
  if (!b) { const st = e.target.closest('[data-peek]'); if (st) { const i = +st.dataset.peek; peek = peek === i ? -1 : i; render(); } return; }
  if (b.disabled) return;
  if (b.hasAttribute('data-close')) { $('#modal').innerHTML = ''; return; }
  if (b.dataset.confirm === 'leave') { $('#modal').innerHTML = ''; return send({ a: 'leave' }); }
  if (b.dataset.sit !== undefined) return modal('sit', +b.dataset.sit);
  if (b.dataset.say) return say(b.dataset.say);
  if (b.dataset.to) { const r = $('#raise'); if (r) { r.value = b.dataset.to; r.dispatchEvent(new Event('input')); } return; }
  if (b.dataset.act) { const r = $('#raise'); return send({ a: 'act', do: b.dataset.act, to: b.dataset.act === 'raise' ? +(r ? r.value : 0) : 0 }); }
  const a = b.dataset.a;
  if (a === 'top') return modal('top');
  if (a === 'leave') return modal('leave');
  if (a === 'sitout') return send({ a: 'sitout', on: true });
  if (a === 'back') return send({ a: 'sitout', on: false });
  if (b.dataset.seatout !== undefined) return send({ a: 'seatout', seat: +b.dataset.seatout, on: !!b.dataset.on });
  const hx = b.dataset.hx;
  if (hx === 'straddle' || hx === 'bot') return send({ a: hx, on: !!b.dataset.on });
  if (hx) return send({ a: hx, x: b.dataset.x !== undefined ? +b.dataset.x : +$(hx === 'bomb' ? '#hBomb' : '#hNit').value });
  const h = b.dataset.host;
  if (h === 'open') { const [sb, bb] = $('#hBlinds').value.split('/').map(Number); return send({ a: 'open', post: $('#hPost').checked, cfg: { sb, bb, min: +$('#hMin').value, max: +$('#hMax').value, turn: +$('#hTurn').value, straddle: $('#hStrO').checked, bomb: +$('#hBombO').value, nit: +$('#hNitO').value } }); }
  if (h) return send({ a: h });
});
document.addEventListener('change', e => { const id = e.target.id; if (['hBlinds', 'hMin', 'hMax', 'hTurn', 'hBomb', 'hNit', 'hBombO', 'hNitO'].includes(id)) hostDraft[id] = e.target.value; if (id === 'hPost' || id === 'hStrO') hostDraft[id] = e.target.checked; if (e.target.id === 'hBlinds2') { const [sb, bb] = e.target.value.split('/').map(Number); send({ a: 'blinds', sb, bb }); } });
document.addEventListener('submit', e => { if (e.target.id === 'sayF') { e.preventDefault(); const i = $('#sayIn'); say(i.value); i.value = ''; } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) api().catch(() => {}); });

(async function start() {
  try { await api(); } catch (e) { $('#view').innerHTML = '<p class="loading">Couldn\'t reach the table. Refresh to try again.</p>'; return; }
  poll();
  if (S.ably) { const sc = document.createElement('script'); sc.src = '/ably.min.js'; sc.onload = connectLive; document.head.appendChild(sc); }
})();
</script>
