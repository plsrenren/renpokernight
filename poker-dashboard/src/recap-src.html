<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Recap · Poker Club @ The Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=Nunito:wght@600;700;800;900&family=IBM+Plex+Mono:wght@600&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* Recap page: pick a night and see the "Cozy night" card. Save/Copy/Share use the same PNG that goes to Discord (/api/recap). */
:root {
  --page: #100e20; --fg: #ece9fb; --muted: #9a94c4; --line: #2f2a52; --btn: #221e3d;
  --night: #15132a; --panel: #221e3d; --bright: #f3f1ff; --soft: #cfcaf0; --up: #8ee0b0; --down: #f59bb0;
  --gold: #f1c75b; --violet: #6e52c8; --maroon: #a23b58; --peri: #a9b4f6;
  --logo: url("__LOGO__");
  --title: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; font-weight: 600; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: max(24px, env(safe-area-inset-top, 0px)) 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.bar a { color: var(--muted); font-size: 14px; text-decoration: none; font-weight: 700; }
.bar a:hover { color: var(--peri); }
.ctl { display: flex; gap: 8px; align-items: center; }
label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
select, button { font: inherit; font-weight: 700; color: var(--fg); background: var(--btn); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
button { cursor: pointer; }
button.primary { background: linear-gradient(120deg, #3a2a6e, var(--maroon)); border-color: transparent; color: #fff; }
button:disabled { opacity: .5; cursor: default; }
select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--peri); outline-offset: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.status.err { color: var(--down); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; }

/* ===== Cozy night card ===== */
.f2 { width: 560px; max-width: 100%; border-radius: 22px; padding: 18px; display: grid; gap: 14px; color: var(--fg);
  background: var(--night) radial-gradient(80% 60% at 0% 0%, rgba(110,82,200,.35), transparent 60%) no-repeat; }
.f2-top { display: flex; gap: 12px; align-items: center; }
.f2-top .lg { width: 52px; height: 52px; flex: none; background: var(--logo) center / contain no-repeat; }
.f2 h1 { margin: 0; font-family: var(--title); font-weight: 400; font-size: 30px; line-height: 1; color: #fff; }
.f2 .sub { font-size: 13px; color: #b9b3e0; font-weight: 700; }
.f2 .sub .off { color: var(--down); }
.f2-win { display: flex; align-items: center; gap: 14px; background: linear-gradient(120deg, #3a2a6e, var(--maroon)); border-radius: 18px; padding: 14px 16px; }
.f2-win .crown { width: 46px; height: 46px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; flex: none; }
.f2-win .k { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #ffd7e1; }
.f2-win .nm { font-weight: 900; font-size: 24px; color: #fff; line-height: 1.1; overflow-wrap: anywhere; }
.f2-win .nm em { font-style: normal; font-family: var(--mono); font-weight: 600; font-size: 20px; color: #ffe9a3; white-space: nowrap; }
.f2-win .note { margin-left: auto; text-align: right; font-size: 12px; font-weight: 800; color: #ffd7e1; line-height: 1.25; flex: none; }
.tl-h { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: -6px; }
.tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
.tiles li { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 14px; padding: 7px 10px; min-width: 0; }
.av { --h: 260; width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 14px;
  background: hsl(var(--h) 80% 86%); color: hsl(var(--h) 45% 28%); }
.tiles .tn { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
.tiles b { color: var(--bright); font-weight: 800; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12.5px; }
.up { color: var(--up); } .down { color: var(--down); } .even { color: var(--soft); }
.tiles svg { flex: none; display: block; }
.chart { background: var(--panel); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.chart .ch { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chart .ch b { font-weight: 900; font-size: 15px; color: var(--bright); }
.chart .ch span { font-size: 12px; font-weight: 700; color: var(--muted); }
.plot { position: relative; width: 100%; }
.plot svg { display: block; width: 100%; height: auto; }
.plot .t { position: absolute; font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--muted); white-space: nowrap; line-height: 1; }
.plot .t.hot { color: #fff; font-size: 11.5px; }
.plot .t.lbl { color: var(--soft); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 700; color: var(--soft); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend b { font-family: var(--mono); font-weight: 600; color: var(--fg); }
.qt ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); grid-auto-flow: column; column-gap: 14px; font-size: 13px; }
.qt li { display: grid; grid-template-columns: 18px 20px minmax(0,1fr) 30px auto; gap: 6px; align-items: center; height: 24px; padding: 0 6px; border-radius: 8px; }
.qt li.lead { background: rgba(241,199,91,.16); }
.qt li.lead .nm { color: var(--gold); }
.qt .rk { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.qt .nm { font-weight: 800; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qt .mv { font-family: var(--mono); font-size: 10.5px; text-align: right; color: #6d6895; }
.qt .mv.new { color: var(--gold); }
.qt .amt { font-size: 12px; text-align: right; }
@media (max-width: 540px) { .qt ol { grid-template-columns: minmax(0,1fr); grid-auto-flow: row; grid-template-rows: none !important; } }
.av { position: relative; overflow: hidden; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.f2-win .crown.pic { background: var(--gold); padding: 3px; }
.f2-win .crown.pic .av { width: 40px; height: 40px; font-size: 16px; }
/* storylines */
.sl { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; font-weight: 700; color: var(--soft); line-height: 1.45; }
.sl li { display: flex; gap: 10px; align-items: flex-start; }
.sl li svg { flex: none; width: 14px; height: 14px; margin: 3px 3px 0; }
.sl .name { color: var(--bright); font-weight: 900; } .sl .gold { color: var(--gold); font-weight: 900; }
.sl .up, .sl .down { font-family: var(--mono); font-weight: 600; }
.sec { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
/* quarter leaders bars */
.lb { display: grid; grid-template-columns: repeat(var(--n), minmax(0,1fr)); }
.lb .col { display: grid; grid-template-rows: var(--pos) var(--neg) auto; justify-items: center; min-width: 0; }
.lb .p, .lb .n { width: 100%; display: flex; flex-direction: column; align-items: center; }
.lb .p { justify-content: flex-end; border-bottom: 2px solid #4a4570; }
.lb .n { justify-content: flex-start; }
.lb .bar { width: min(64px, 70%); }
.lb .p .bar { border-radius: 8px 8px 0 0; } .lb .n .bar { border-radius: 0 0 8px 8px; }
.lb .v { font-family: var(--mono); font-weight: 600; font-size: 12px; margin: 3px 0; white-space: nowrap; }
.lb .who { display: grid; justify-items: center; gap: 3px; margin-top: 8px; min-width: 0; max-width: 100%; }
.lb .who .av { width: 30px; height: 30px; font-size: 12px; border: 2px solid var(--ring); }
.lb .who b { font-weight: 900; font-size: 13px; color: var(--bright); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .col:first-child .who b { color: var(--gold); }
/* awards */
.aw { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px 14px; }
.aw > div { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; background: rgba(255,255,255,.04); min-width: 0; }
.aw .ic { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.07); display: grid; place-items: center; flex: none; }
.aw .ic svg { width: 20px; height: 20px; }
.aw .t { display: grid; min-width: 0; line-height: 1.25; }
.aw .t small { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.av.sm { width: 20px; height: 20px; font-size: 9px; } .av.xs { width: 18px; height: 18px; font-size: 8px; margin-right: 6px; vertical-align: -3px; display: inline-grid; }
.aw .t b { font-weight: 900; font-size: 14px; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aw .t span { font-family: var(--mono); font-size: 11px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 540px) { .aw { grid-template-columns: minmax(0,1fr); } }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
@media (max-width: 540px) { .tiles { grid-template-columns: minmax(0,1fr); } .f2-win .note { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span style="display:flex;gap:14px;flex-wrap:wrap"><a href="/">← Dashboard</a><a href="/hall">Hall of Fame</a></span>
    <div class="ctl"><label for="night">Night</label><select id="night"></select></div>
  </div>
  <div class="stage"><article class="f2" id="card" aria-live="polite"><div class="empty">Reading the sheet…</div></article></div>
  <div class="actions">
    <button class="primary" id="save" disabled>Save image</button>
    <button id="copy" disabled>Copy image</button>
    <button id="share" disabled hidden>Share</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script type="module">
import { SHEET_URL, MEMBERS_URL, COLORS, toNights, pickNight, model, usd, initials, hueFor, sparkSvg, CROWN_SVG, stories, iconSvg, memberIds, avatarUrl } from '/recap-core.js';
let IDS = {};
// a player's circle: initials, with their Discord pfp laid on top when we have one (a missing pfp just leaves the initials)
const av = (name, extra = '', size = '') => `<span class="av${size ? ' ' + size : ''}" style="--h:${hueFor(name)};${extra}">${esc(initials(name))}${IDS[name] ? `<img src="${avatarUrl(IDS[name])}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
const MEDAL = [['#ffe08a', '#d9a72e'], ['#e6e3f7', '#a9a4c8'], ['#f0b48a', '#b46a3c'], ['#a08cf0', '#6e52c8'], ['#a08cf0', '#6e52c8']];
const AWC = { flame: '#ff9d6b', chair: '#a9b4f6', target: '#8ee0b0', chips: '#8f78f0', gift: '#f59bb0' };
const storyHtml = (parts, col) => `<li>${iconSvg('spark', col, 14)}<span>${parts.map(p => typeof p === 'string' ? esc(p) : `<span class="${Object.keys(p)[0]}">${esc(Object.values(p)[0])}</span>`).join('')}</span></li>`;
function leaders(rows) {
  const top = rows.slice(0, 5), hi = Math.max(0, ...top.map(r => r.net)), lo = Math.min(0, ...top.map(r => r.net));
  const H = 140, k = H / Math.max(1, hi - lo), pos = Math.round(hi * k) + 22, neg = Math.round(-lo * k) + (lo < 0 ? 22 : 0);
  return `<div class="lb" style="--n:${top.length};--pos:${pos}px;--neg:${neg}px">${top.map((r, i) => {
    const h = Math.max(3, Math.abs(r.net) * k), [a, b] = MEDAL[i];
    const bar = `<div class="bar" style="height:${h.toFixed(1)}px;background:linear-gradient(${r.net >= 0 ? 180 : 0}deg,${a},${b})"></div>`, v = `<div class="v ${cls(r.net)}">${usd(r.net)}</div>`;
    return `<div class="col"><div class="p">${r.net >= 0 ? v + bar : ''}</div><div class="n">${r.net < 0 ? bar + v : ''}</div><div class="who">${av(r.name, `--ring:${a}`)}<b>${esc(r.name)}</b></div></div>`;
  }).join('')}</div>`;
}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'even';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function plot(ch) {
  const lab = ch.labels.map(l => {
    const tx = l.anchor === 'end' ? '-100%' : l.anchor === 'middle' ? '-50%' : '0';
    return `<span class="t${l.hot ? ' hot' : l.hot === false ? ' lbl' : ''}" style="left:${(l.x / ch.w * 100).toFixed(2)}%;top:${(l.y / ch.h * 100).toFixed(2)}%;transform:translate(${tx},-50%)">${esc(l.text)}</span>`;
  }).join('');
  return `<div class="plot">${ch.svg}${lab}</div>`;
}

const mvHtml = m => m === '' ? '<span class="mv"></span>' : m === 'new' ? '<span class="mv new">new</span>'
  : m > 0 ? `<span class="mv up">▲${m}</span>` : m < 0 ? `<span class="mv down">▼${-m}</span>` : '<span class="mv">–</span>';
function render(m) {
  const tiles = m.rows.map(r => `<li>${av(r.player)}<div class="tn"><b>${esc(r.player)}</b><span class="amt ${cls(r.net)}">${usd(r.net)}</span></div>${sparkSvg(r.form)}</li>`).join('');
  const st = m.st, Q = m.raceTitle.replace('Race for ', '');
  $('card').innerHTML = `
    <div class="f2-top"><div class="lg" role="img" aria-label="Poker Club @ The Study logo"></div>
      <div><h1>${esc(m.title)}</h1><div class="sub">${esc(m.sub)}${m.off ? ` · <span class="off">${esc(m.off)}</span>` : ''}</div></div></div>
    <div class="f2-win">${IDS[m.winner.name] ? `<div class="crown pic">${av(m.winner.name)}</div>` : `<div class="crown">${CROWN_SVG}</div>`}<div><div class="k">Winner winner</div><div class="nm">${esc(m.winner.name)} <em>${usd(m.winner.net)}</em></div></div><div class="note">${m.winner.note}</div></div>
    <div class="tl-h">Tonight · line shows each player's last 6 nights</div>
    <ul class="tiles">${tiles}</ul>
    <div class="chart"><div class="ch"><b>Tonight's storylines</b></div><ul class="sl">${st.night.map(p => storyHtml(p, '#f1c75b')).join('')}</ul></div>
    <div class="chart"><div class="ch"><b>${esc(Q)} leaders</b><span>top ${Math.min(5, m.standings.rows.length)} so far</span></div>${leaders(m.standings.rows)}</div>
    <div class="chart qt"><div class="ch"><b>${esc(m.standings.title)}</b><span>${esc(m.standings.note)}</span></div>
      <ol style="grid-template-rows:repeat(${Math.ceil(m.standings.rows.length / 2)},auto)">${m.standings.rows.map(r => `<li class="${r.rank === 1 ? 'lead' : ''}"><span class="rk">${r.rank}</span>${av(r.name, '', 'sm')}<span class="nm">${esc(r.name)}</span>${mvHtml(r.mv)}<span class="amt ${cls(r.net)}">${usd(r.net)}</span></li>`).join('')}</ol></div>
    <div class="chart"><div class="ch"><b>${esc(st.quarterTitle)}</b><span>${esc(st.awardsNote)}</span></div>
      <ul class="sl">${st.quarter.map(p => storyHtml(p, '#a9b4f6')).join('')}</ul>
      <div class="sec">${esc(st.awardsLabel)}</div>
      <div class="aw">${st.awards.map(a => `<div><span class="ic">${iconSvg(a.icon, AWC[a.icon], 20)}</span><span class="t"><small>${esc(a.title)}</small><b class="aw-who">${IDS[a.who] ? av(a.who, '', 'xs') : ''}${esc(a.who)}</b><span>${esc(a.what)}</span></span></div>`).join('')}</div></div>`;
  document.title = `${m.title} · ${m.sub.split(' · ')[0]}`;
}

let NIGHTS = [];
const current = () => NIGHTS.find(x => x.id === $('night').value) || NIGHTS[0];
function show(id) {
  const n = NIGHTS.find(x => x.id === id) || NIGHTS[0];
  if (!n) return;
  $('night').value = n.id;
  render({ ...model(NIGHTS, n), st: stories(NIGHTS, n) });
  try { history.replaceState(null, '', n === NIGHTS[0] ? location.pathname : '#' + n.key + (NIGHTS.filter(x => x.key === n.key).length > 1 ? '-' + n.type.toLowerCase() : '')); } catch (e) {}
}
function idFromHash() {
  const h = location.hash.slice(1); if (!h) return null;
  const n = pickNight(NIGHTS, h.slice(0, 10), h.slice(11));
  return n ? n.id : null;
}
function status(msg, err) { $('status').textContent = msg; $('status').className = 'status' + (err ? ' err' : ''); }

async function load() {
  try {
    const [res, mem] = await Promise.all([fetch(SHEET_URL, { cache: 'no-store' }), fetch(MEMBERS_URL, { cache: 'no-store' }).catch(() => null)]);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    NIGHTS = toNights(await res.text());
    try { if (mem && mem.ok) IDS = memberIds(await mem.text()); } catch (e) {}
    if (!NIGHTS.length) throw new Error('no nights found');
    $('night').innerHTML = NIGHTS.map(n => `<option value="${n.id}">${MONTHS[n.m - 1]} ${n.d}, ${n.y} · ${n.type}</option>`).join('');
    show(idFromHash());
    ['save', 'copy', 'share'].forEach(id => $(id).disabled = false);
  } catch (e) {
    $('card').innerHTML = '<div class="empty">Couldn’t read the Google Sheet. Check your connection and reload.</div>';
    status('Error reading the sheet: ' + e.message, true);
  }
}
$('night').addEventListener('change', e => show(e.target.value));
window.addEventListener('hashchange', () => { const id = idFromHash(); if (id) show(id); });

// The image is the same PNG the Discord post uses, drawn by /api/recap
async function pngBlob() {
  const n = current();
  const r = await fetch(`/api/recap?night=${n.key}&type=${encodeURIComponent(n.type)}`);
  if (!r.ok) throw new Error(await r.text());
  return await r.blob();
}
const fileName = () => 'the-study-recap-' + (current()?.key || 'night') + '.png';
$('save').addEventListener('click', async () => {
  status('Making image…');
  try {
    const blob = await pngBlob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    status('Saved ' + fileName());
  } catch (e) { status('Couldn’t make the image: ' + e.message, true); }
});
$('copy').addEventListener('click', async () => {
  status('Making image…');
  try {
    if (!window.ClipboardItem || !navigator.clipboard?.write) throw new Error('this browser can’t copy images, use Save image');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob() })]);
    status('Copied. Paste it into Discord.');
  } catch (e) { status('Couldn’t copy: ' + e.message, true); }
});
try { if (navigator.canShare && navigator.canShare({ files: [new File([''], 'x.png', { type: 'image/png' })] })) $('share').hidden = false; } catch (e) {}
$('share').addEventListener('click', async () => {
  status('Making image…');
  try {
    const blob = await pngBlob();
    await navigator.share({ files: [new File([blob], fileName(), { type: 'image/png' })] });
    status('');
  } catch (e) { status(e.name === 'AbortError' ? '' : 'Couldn’t share: ' + e.message, e.name !== 'AbortError'); }
});
load();
</script>

<!-- phone-only tab bar at the bottom (the header buttons hide on phones) -->
<style>
.tabbar { display: none; }
@media (max-width: 640px) {
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: grid; grid-template-columns: repeat(4, 1fr);
    background: rgba(22,19,42,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,.1);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
